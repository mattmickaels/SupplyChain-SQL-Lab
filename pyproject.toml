[project]
name = "sclab"
version = "0.1.0"
description = "Local SQL lab for a fictional semiconductor equipment supply chain."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb",
    "fastapi",
    "jinja2",
    "markdown-it-py",
    "numpy",
    "pandas",
    "platformdirs",
    "rich",
    "uvicorn",
]

[project.scripts]
sclab = "sclab.cli:main"

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sclab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
