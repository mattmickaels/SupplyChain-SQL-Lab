<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SQL lab{% endblock %} - {{ company }}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/vendor/codemirror.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="top">
    <a class="wordmark" href="/">{{ company }}</a>
    <nav aria-label="Main">
      <a href="/">Lessons</a>
      <a href="/screens">Screens</a>
      <a href="/notebooks">Notebook</a>
      <a href="/schema">Schema</a>
      <a href="/playground">Playground</a>
    </nav>
    <form class="tcode-box" action="/screens/go" method="get">
      <label for="header-tcode">Transaction code</label>
      <input id="header-tcode" name="tcode" size="6" maxlength="8" autocomplete="off" spellcheck="false">
      {% if screen is defined %}
      <input type="hidden" name="key" value="{{ key }}">
      {% for name in screen.params %}
      <input type="hidden" name="{{ name }}" value="{{ request.query_params.get(name, '') }}">
      {% endfor %}
      {% endif %}
      <button type="submit">Go</button>
    </form>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/vendor/htmx.min.js"></script>
  <script src="/static/vendor/codemirror.min.js"></script>
  <script src="/static/vendor/mode/sql/sql.min.js"></script>
  <script src="/static/vendor/addon/edit/matchbrackets.min.js"></script>
  {% block head_scripts %}{% endblock %}
  <script src="/static/app.js"></script>
</body>
</html>
