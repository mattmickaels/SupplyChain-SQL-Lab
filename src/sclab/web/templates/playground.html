{% extends "base.html" %}
{% block title %}Playground{% endblock %}
{% block content %}
<p class="today">Today in the lab is {{ today }}.</p>
<h1>Playground</h1>
<p>This editor writes to the practice database. The lesson database stays read-only.</p>
<form id="playground-form">
  <label for="playground-sql">SQL</label>
  <textarea id="playground-sql" name="sql" data-editor rows="8" aria-label="Playground"></textarea>
  <input type="hidden" name="target" value="sandbox">
  <div class="actions">
    <button type="button" data-run hx-post="/api/run" hx-include="#playground-form" hx-target="#playground-result">Run</button>
    <button type="button" hx-post="/api/sandbox/reset" hx-target="#reset-note">Reset practice database</button>
  </div>
</form>
<div id="reset-note"></div>
<div id="playground-result"></div>
{% endblock %}
