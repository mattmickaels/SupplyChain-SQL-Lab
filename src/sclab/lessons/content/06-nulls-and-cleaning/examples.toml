[[example]]
id = "coalesce-three-lead-times"
sql = """
SELECT p.material_no,
       p.plant_code,
       p.planned_lead_time_days,
       s.quoted_lead_time_days,
       COALESCE(p.planned_lead_time_days, s.quoted_lead_time_days) AS filled_lead_time_days
FROM material_plant AS p
LEFT JOIN material_supplier AS s
  ON s.material_no = p.material_no
 AND s.is_primary = true
WHERE (p.material_no = 'M-000002' AND p.plant_code = 'SC01')
   OR (p.material_no = 'M-001334' AND p.plant_code = 'AU01')
   OR (p.material_no = 'M-001344' AND p.plant_code = 'SC01')
ORDER BY p.material_no
"""
expected_rows = [
  ["M-000002", "SC01", "NULL", "NULL", "NULL"],
  ["M-001334", "AU01", "NULL", 0, 0],
  ["M-001344", "SC01", "NULL", 131, 131],
]
order_matters = true

[[example]]
id = "kept-spindle-material"
sql = """
SELECT MIN(material_no) AS material_no,
       TRIM(description) AS trimmed_description
FROM material
WHERE TRIM(description) = 'Aligner spindle, variant 103'
GROUP BY TRIM(description)
"""
expected_rows = [["M-004744", "Aligner spindle, variant 103"]]
order_matters = false
