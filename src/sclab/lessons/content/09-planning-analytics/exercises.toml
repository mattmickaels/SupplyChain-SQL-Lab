[[exercise]]
id = "plan-corvane-line-compare"
title = "Order risk with and without the slip"
prompt_md = """
Run the order-risk check twice side by side: as it stands (0 days) and with every confirmed date of supplier V-10017 pushed back by 28 days.
Put 28 AS slip_days in a parameters CTE.
Only outstanding V-10017 supply moves. Received quantities, other suppliers, stock and need stay as they are.
Count only POs ordered on or before the snapshot.
Use the same rules as the order-risk exercise: RF generators only, production rule Planned or Released after DATE '2026-11-01', Open ETC tool lines whose order date is on or before the snapshot.
For each sales line return so_no, line_no, baseline_days, slipped_days.
Each is the largest positive delay in days under that run, or 0 when the line is not late.
Keep only the lines that are late in at least one run, in that column order, sorted by so_no, then line_no.
"""
hints = [
  "Run your order-risk method for two scenarios at once: slip 0 days and slip 28 days. Only the Corvane lines move.",
  "Put 28 AS slip_days in a parameters CTE and a scenarios CTE holding 0 and that value. CROSS JOIN scenarios to the supply events, add the slip to a V-10017 confirmed date, and carry slip_days through the ledger and the join. Take the largest delay for each sales line and scenario, then put the two scenarios in two columns with MAX(CASE WHEN ...).",
  "WITH RECURSIVE ___ (your need ledger), parameters AS (SELECT 28 AS slip_days), scenarios AS (SELECT 0 AS slip_days UNION ALL SELECT slip_days FROM parameters), ___ (supply events, ledger and availability, each with slip_days), line_risk AS (SELECT i.so_no, i.line_no, a.slip_days, GREATEST(MAX(datediff('day', ___, ___)), 0) AS days_at_risk FROM ___ GROUP BY ___) SELECT so_no, line_no, MAX(CASE WHEN slip_days = 0 THEN days_at_risk ELSE 0 END) AS baseline_days, MAX(CASE WHEN ___ THEN days_at_risk ELSE 0 END) AS slipped_days FROM line_risk GROUP BY so_no, line_no HAVING ___ ORDER BY so_no, line_no"
]
reference_sql = ["""
WITH RECURSIVE tree AS (
    SELECT m.material_no AS root, m.family_code, b.component_material_no AS material_no,
           CAST(b.qty_per AS DECIMAL(20,6)) AS qty, 1 AS level
    FROM material m JOIN bom_item b ON b.parent_material_no = m.material_no
    WHERE m.material_type = 'TOOL'
    UNION ALL
    SELECT t.root, t.family_code, b.component_material_no,
           CAST(t.qty * b.qty_per AS DECIMAL(20,6)), t.level + 1
    FROM tree t JOIN bom_item b ON b.parent_material_no = t.material_no
    WHERE t.level < 10
), leaves AS (
    SELECT t.root, t.family_code, t.material_no, SUM(t.qty) AS qty
    FROM tree t JOIN material m ON m.material_no = t.material_no
    WHERE m.description LIKE 'RF generator,%'
    GROUP BY t.root, t.family_code, t.material_no
), spare_plant AS (
    SELECT material_no,
           MIN(CASE family_code WHEN 'ETC' THEN 'SC01' WHEN 'CMP' THEN 'SG01'
                                ELSE 'AU01' END) AS plant_code
    FROM leaves
    GROUP BY material_no
), production_need AS (
    SELECT p.prod_order_no, l.material_no, p.plant_code,
           p.planned_start AS need_date, p.qty * l.qty AS qty
    FROM production_order p JOIN leaves l ON l.root = p.material_no
    WHERE p.status IN ('Planned', 'Released') AND p.planned_start > DATE '2026-11-01'
), spare_need AS (
    SELECT i.material_no, sp.plant_code, i.promised_date AS need_date, i.qty
    FROM sales_order_item i JOIN spare_plant sp ON sp.material_no = i.material_no
    WHERE i.status = 'Open' AND i.promised_date > DATE '2026-11-01'
), need_ledger AS (
    SELECT material_no, plant_code, need_date, day_qty,
           SUM(day_qty) OVER (PARTITION BY material_no, plant_code ORDER BY need_date
                              ROWS UNBOUNDED PRECEDING) AS cumulative_qty
    FROM (
        SELECT material_no, plant_code, need_date, SUM(qty) AS day_qty
        FROM (
            SELECT material_no, plant_code, need_date, qty FROM production_need
            UNION ALL
            SELECT material_no, plant_code, need_date, qty FROM spare_need
        ) needs
        GROUP BY material_no, plant_code, need_date
    ) daily
), outstanding AS (
    SELECT i.po_no, i.line_no, i.material_no, h.plant_code, h.supplier_no,
           i.confirmed_delivery_date, i.order_qty - COALESCE(SUM(g.qty), 0) AS qty
    FROM purchase_order_item i JOIN purchase_order h ON h.po_no = i.po_no
    LEFT JOIN goods_receipt g ON g.po_no = i.po_no AND g.line_no = i.line_no
    WHERE h.order_date <= DATE '2026-11-01'
    GROUP BY i.po_no, i.line_no, i.material_no, h.plant_code, h.supplier_no,
             i.confirmed_delivery_date, i.order_qty
    HAVING i.order_qty > COALESCE(SUM(g.qty), 0)
), stock AS (
    SELECT material_no, plant_code, SUM(qty_on_hand) AS qty FROM inventory
    WHERE storage_location = 'RM01'
    GROUP BY material_no, plant_code
), parameters AS (
    SELECT 28 AS slip_days
), scenarios AS (
    SELECT slip_days
    FROM (
        SELECT 0 AS slip_days
        UNION ALL
        SELECT slip_days FROM parameters
    ) runs
), supply_events AS (
    SELECT material_no, plant_code, slip_days, supply_date, qty
    FROM (
        SELECT s.material_no, s.plant_code, sc.slip_days,
               DATE '2026-11-01' AS supply_date, s.qty
        FROM stock s JOIN material m ON m.material_no = s.material_no
        CROSS JOIN scenarios sc
        WHERE m.description LIKE 'RF generator,%'
        UNION ALL
        SELECT o.material_no, o.plant_code, sc.slip_days,
               GREATEST(CAST(o.confirmed_delivery_date
                             + CASE WHEN o.supplier_no = 'V-10017' THEN sc.slip_days ELSE 0 END
                               * INTERVAL 1 DAY AS DATE),
                        DATE '2026-11-01'),
               o.qty
        FROM outstanding o JOIN material m ON m.material_no = o.material_no
        CROSS JOIN scenarios sc
        WHERE m.description LIKE 'RF generator,%' AND o.confirmed_delivery_date IS NOT NULL
    ) events
), supply_ledger AS (
    SELECT material_no, plant_code, slip_days, supply_date,
           SUM(day_qty) OVER (PARTITION BY material_no, plant_code, slip_days
                              ORDER BY supply_date ROWS UNBOUNDED PRECEDING) AS cumulative_qty
    FROM (
        SELECT material_no, plant_code, slip_days, supply_date, SUM(qty) AS day_qty
        FROM supply_events
        GROUP BY material_no, plant_code, slip_days, supply_date
    ) daily
), availability AS (
    SELECT n.prod_order_no, sc.slip_days, MIN(s.supply_date) AS available_date
    FROM production_need n
    JOIN need_ledger d ON d.material_no = n.material_no AND d.plant_code = n.plant_code
                      AND d.need_date = n.need_date
    CROSS JOIN scenarios sc
    LEFT JOIN supply_ledger s ON s.material_no = n.material_no AND s.plant_code = n.plant_code
                             AND s.slip_days = sc.slip_days
                             AND s.cumulative_qty >= d.cumulative_qty
    GROUP BY n.prod_order_no, n.material_no, n.plant_code, n.need_date, sc.slip_days
), line_risk AS (
    SELECT i.so_no, i.line_no, a.slip_days,
           GREATEST(MAX(datediff('day', p.planned_start, a.available_date)), 0) AS days_at_risk
    FROM availability a JOIN production_order p ON p.prod_order_no = a.prod_order_no
    JOIN sales_order_item i ON i.so_no = p.so_no AND i.line_no = p.so_line_no
    JOIN sales_order h ON h.so_no = i.so_no
    JOIN material m ON m.material_no = p.material_no
    WHERE i.status = 'Open' AND m.material_type = 'TOOL' AND m.family_code = 'ETC'
      AND h.order_date <= DATE '2026-11-01'
    GROUP BY i.so_no, i.line_no, a.slip_days
), line_compare AS (
    SELECT so_no, line_no,
           MAX(CASE WHEN slip_days = 0 THEN days_at_risk ELSE 0 END) AS baseline_days,
           MAX(CASE WHEN slip_days > 0 THEN days_at_risk ELSE 0 END) AS slipped_days
    FROM line_risk
    GROUP BY so_no, line_no
)
SELECT so_no, line_no, baseline_days, slipped_days
FROM line_compare
WHERE baseline_days > 0 OR slipped_days > 0
ORDER BY so_no, line_no
"""]
order_matters = true
names_matter = true
excel_tip = "Use a scenario input cell for slip days, then show each line's delay under both inputs side by side."
databricks_note = "o.confirmed_delivery_date + CASE ... END * INTERVAL 1 DAY is supported as written; if it is rejected, use date_add(o.confirmed_delivery_date, CASE WHEN o.supplier_no = 'V-10017' THEN sc.slip_days ELSE 0 END). datediff('day', p.planned_start, a.available_date) becomes datediff(a.available_date, p.planned_start)."

[[exercise]]
id = "plan-corvane-what-if"
title = "What if Corvane slips again?"
prompt_md = """
Count the lines affected by the slip.
Use the same comparison as the previous step: slip_days of 28 for supplier V-10017 in a parameters CTE, and the current plan as the baseline.
Return one row with baseline_at_risk, slipped_at_risk, additional_at_risk, in that column order.
baseline_at_risk and slipped_at_risk count the sales lines that are late in each run.
additional_at_risk counts the lines that are late only after the slip; it does not add up delay days.
Only V-10017 (Corvane) confirmations slip; the dates of other suppliers do not move.
The slip is a what-if on supplier dates; it does not say customer shipment dates move by the same number of days.
"""
hints = [
  "Each sales line is either late or not late in each run. Count lines, not days.",
  "Use your previous query as a CTE. Count the lines with baseline_days > 0, the lines with slipped_days > 0, and the lines late only after the slip.",
  "WITH RECURSIVE ___ (your previous query, as a CTE named line_compare, without its final WHERE) SELECT SUM(CASE WHEN ___ THEN 1 ELSE 0 END) AS baseline_at_risk, SUM(CASE WHEN ___ THEN 1 ELSE 0 END) AS slipped_at_risk, SUM(CASE WHEN ___ AND ___ THEN 1 ELSE 0 END) AS additional_at_risk FROM line_compare"
]
reference_sql = ["""
WITH RECURSIVE tree AS (
    SELECT m.material_no AS root, m.family_code, b.component_material_no AS material_no,
           CAST(b.qty_per AS DECIMAL(20,6)) AS qty, 1 AS level
    FROM material m JOIN bom_item b ON b.parent_material_no = m.material_no
    WHERE m.material_type = 'TOOL'
    UNION ALL
    SELECT t.root, t.family_code, b.component_material_no,
           CAST(t.qty * b.qty_per AS DECIMAL(20,6)), t.level + 1
    FROM tree t JOIN bom_item b ON b.parent_material_no = t.material_no
    WHERE t.level < 10
), leaves AS (
    SELECT t.root, t.family_code, t.material_no, SUM(t.qty) AS qty
    FROM tree t JOIN material m ON m.material_no = t.material_no
    WHERE m.description LIKE 'RF generator,%'
    GROUP BY t.root, t.family_code, t.material_no
), spare_plant AS (
    SELECT material_no,
           MIN(CASE family_code WHEN 'ETC' THEN 'SC01' WHEN 'CMP' THEN 'SG01'
                                ELSE 'AU01' END) AS plant_code
    FROM leaves
    GROUP BY material_no
), production_need AS (
    SELECT p.prod_order_no, l.material_no, p.plant_code,
           p.planned_start AS need_date, p.qty * l.qty AS qty
    FROM production_order p JOIN leaves l ON l.root = p.material_no
    WHERE p.status IN ('Planned', 'Released') AND p.planned_start > DATE '2026-11-01'
), spare_need AS (
    SELECT i.material_no, sp.plant_code, i.promised_date AS need_date, i.qty
    FROM sales_order_item i JOIN spare_plant sp ON sp.material_no = i.material_no
    WHERE i.status = 'Open' AND i.promised_date > DATE '2026-11-01'
), need_ledger AS (
    SELECT material_no, plant_code, need_date, day_qty,
           SUM(day_qty) OVER (PARTITION BY material_no, plant_code ORDER BY need_date
                              ROWS UNBOUNDED PRECEDING) AS cumulative_qty
    FROM (
        SELECT material_no, plant_code, need_date, SUM(qty) AS day_qty
        FROM (
            SELECT material_no, plant_code, need_date, qty FROM production_need
            UNION ALL
            SELECT material_no, plant_code, need_date, qty FROM spare_need
        ) needs
        GROUP BY material_no, plant_code, need_date
    ) daily
), outstanding AS (
    SELECT i.po_no, i.line_no, i.material_no, h.plant_code, h.supplier_no,
           i.confirmed_delivery_date, i.order_qty - COALESCE(SUM(g.qty), 0) AS qty
    FROM purchase_order_item i JOIN purchase_order h ON h.po_no = i.po_no
    LEFT JOIN goods_receipt g ON g.po_no = i.po_no AND g.line_no = i.line_no
    WHERE h.order_date <= DATE '2026-11-01'
    GROUP BY i.po_no, i.line_no, i.material_no, h.plant_code, h.supplier_no,
             i.confirmed_delivery_date, i.order_qty
    HAVING i.order_qty > COALESCE(SUM(g.qty), 0)
), stock AS (
    SELECT material_no, plant_code, SUM(qty_on_hand) AS qty FROM inventory
    WHERE storage_location = 'RM01'
    GROUP BY material_no, plant_code
), parameters AS (
    SELECT 28 AS slip_days
), scenarios AS (
    SELECT slip_days
    FROM (
        SELECT 0 AS slip_days
        UNION ALL
        SELECT slip_days FROM parameters
    ) runs
), supply_events AS (
    SELECT material_no, plant_code, slip_days, supply_date, qty
    FROM (
        SELECT s.material_no, s.plant_code, sc.slip_days,
               DATE '2026-11-01' AS supply_date, s.qty
        FROM stock s JOIN material m ON m.material_no = s.material_no
        CROSS JOIN scenarios sc
        WHERE m.description LIKE 'RF generator,%'
        UNION ALL
        SELECT o.material_no, o.plant_code, sc.slip_days,
               GREATEST(CAST(o.confirmed_delivery_date
                             + CASE WHEN o.supplier_no = 'V-10017' THEN sc.slip_days ELSE 0 END
                               * INTERVAL 1 DAY AS DATE),
                        DATE '2026-11-01'),
               o.qty
        FROM outstanding o JOIN material m ON m.material_no = o.material_no
        CROSS JOIN scenarios sc
        WHERE m.description LIKE 'RF generator,%' AND o.confirmed_delivery_date IS NOT NULL
    ) events
), supply_ledger AS (
    SELECT material_no, plant_code, slip_days, supply_date,
           SUM(day_qty) OVER (PARTITION BY material_no, plant_code, slip_days
                              ORDER BY supply_date ROWS UNBOUNDED PRECEDING) AS cumulative_qty
    FROM (
        SELECT material_no, plant_code, slip_days, supply_date, SUM(qty) AS day_qty
        FROM supply_events
        GROUP BY material_no, plant_code, slip_days, supply_date
    ) daily
), availability AS (
    SELECT n.prod_order_no, sc.slip_days, MIN(s.supply_date) AS available_date
    FROM production_need n
    JOIN need_ledger d ON d.material_no = n.material_no AND d.plant_code = n.plant_code
                      AND d.need_date = n.need_date
    CROSS JOIN scenarios sc
    LEFT JOIN supply_ledger s ON s.material_no = n.material_no AND s.plant_code = n.plant_code
                             AND s.slip_days = sc.slip_days
                             AND s.cumulative_qty >= d.cumulative_qty
    GROUP BY n.prod_order_no, n.material_no, n.plant_code, n.need_date, sc.slip_days
), line_risk AS (
    SELECT i.so_no, i.line_no, a.slip_days,
           GREATEST(MAX(datediff('day', p.planned_start, a.available_date)), 0) AS days_at_risk
    FROM availability a JOIN production_order p ON p.prod_order_no = a.prod_order_no
    JOIN sales_order_item i ON i.so_no = p.so_no AND i.line_no = p.so_line_no
    JOIN sales_order h ON h.so_no = i.so_no
    JOIN material m ON m.material_no = p.material_no
    WHERE i.status = 'Open' AND m.material_type = 'TOOL' AND m.family_code = 'ETC'
      AND h.order_date <= DATE '2026-11-01'
    GROUP BY i.so_no, i.line_no, a.slip_days
), line_compare AS (
    SELECT so_no, line_no,
           MAX(CASE WHEN slip_days = 0 THEN days_at_risk ELSE 0 END) AS baseline_days,
           MAX(CASE WHEN slip_days > 0 THEN days_at_risk ELSE 0 END) AS slipped_days
    FROM line_risk
    GROUP BY so_no, line_no
)
SELECT SUM(CASE WHEN baseline_days > 0 THEN 1 ELSE 0 END) AS baseline_at_risk,
       SUM(CASE WHEN slipped_days > 0 THEN 1 ELSE 0 END) AS slipped_at_risk,
       SUM(CASE WHEN slipped_days > 0 AND baseline_days = 0 THEN 1 ELSE 0 END) AS additional_at_risk
FROM line_compare
"""]
order_matters = false
names_matter = true
excel_tip = "Compare the two delay columns, then count the lines that are late only in the slipped column."
databricks_note = "o.confirmed_delivery_date + CASE ... END * INTERVAL 1 DAY is supported as written; if it is rejected, use date_add(o.confirmed_delivery_date, CASE WHEN o.supplier_no = 'V-10017' THEN sc.slip_days ELSE 0 END). datediff('day', p.planned_start, a.available_date) becomes datediff(a.available_date, p.planned_start)."
