[[example]]
id = "one-direct-child"
sql = """
SELECT b.component_material_no, m.description, b.qty_per
FROM bom_item AS b
JOIN material AS m ON m.material_no = b.component_material_no
WHERE b.parent_material_no = 'M-000001'
  AND b.component_material_no = 'M-000041'
"""
expected_rows = [
  ["M-000041", "Deposition chamber module, 2-chamber PECVD", 2.0],
]
order_matters = false

[[example]]
id = "etch-levels"
sql = """
WITH RECURSIVE tree AS (
    SELECT b.component_material_no AS material_no, 1 AS level
    FROM bom_item AS b
    WHERE b.parent_material_no = 'M-000011'
    UNION ALL
    SELECT b.component_material_no, t.level + 1
    FROM tree AS t
    JOIN bom_item AS b ON b.parent_material_no = t.material_no
    WHERE t.level < 10
)
SELECT t.level, m.material_type, COUNT(*) AS links
FROM tree AS t
JOIN material AS m ON m.material_no = t.material_no
GROUP BY t.level, m.material_type
ORDER BY t.level, m.material_type
"""
expected_rows = [[1, "MODULE", 7], [2, "SUBASSY", 26], [3, "COMPONENT", 145]]
order_matters = true

[[example]]
id = "one-extended-path"
sql = """
WITH RECURSIVE tree AS (
    SELECT b.component_material_no AS material_no,
           CAST(b.qty_per AS DECIMAL(20,6)) AS extended_qty,
           1 AS level
    FROM bom_item AS b
    WHERE b.parent_material_no = 'M-000011'
      AND b.component_material_no = 'M-000111'
    UNION ALL
    SELECT b.component_material_no,
           CAST(t.extended_qty * b.qty_per AS DECIMAL(20,6)),
           t.level + 1
    FROM tree AS t
    JOIN bom_item AS b ON b.parent_material_no = t.material_no
    WHERE t.level < 10
      AND b.component_material_no IN ('M-000503', 'M-001874')
)
SELECT level, material_no, extended_qty
FROM tree
ORDER BY level
"""
expected_rows = [[1, "M-000111", 2.0], [2, "M-000503", 2.0], [3, "M-001874", 12.0]]
order_matters = true

[[example]]
id = "where-used-one-generator"
sql = """
WITH RECURSIVE used AS (
    SELECT parent_material_no AS material_no, 1 AS level
    FROM bom_item
    WHERE component_material_no = 'M-001321'
    UNION ALL
    SELECT b.parent_material_no, u.level + 1
    FROM used AS u
    JOIN bom_item AS b ON b.component_material_no = u.material_no
    WHERE u.level < 10
)
SELECT u.level, t.material_no, t.description, t.material_type
FROM used AS u
JOIN material AS t ON t.material_no = u.material_no
ORDER BY u.level, t.material_no
"""
expected_rows = [
  [1, "M-001043", "RF delivery subassembly, variant 723", "SUBASSY"],
  [1, "M-001049", "RF delivery subassembly, variant 729", "SUBASSY"],
  [1, "M-001051", "RF delivery subassembly, variant 731", "SUBASSY"],
  [1, "M-001057", "RF delivery subassembly, variant 737", "SUBASSY"],
  [2, "M-000055", "Deposition chamber module, 4-chamber PECVD", "MODULE"],
  [2, "M-000097", "Deposition chamber module, 5-chamber PEALD", "MODULE"],
  [2, "M-000111", "Etch chamber module, 2-chamber conductor", "MODULE"],
  [2, "M-000153", "Etch chamber module, 3-chamber dielectric", "MODULE"],
  [3, "M-000003", "Deposition system, 300mm, 4-chamber, PECVD", "TOOL"],
  [3, "M-000009", "Deposition system, 300mm, 5-chamber, PEALD", "TOOL"],
  [3, "M-000011", "Etch system, 300mm, 2-chamber, conductor", "TOOL"],
  [3, "M-000017", "Etch system, 300mm, 3-chamber, dielectric", "TOOL"],
]
order_matters = true

