[[exercise]]
id = "long-lead-materials"
title = "Long-lead materials"
prompt_md = """
**Situation**

A planner is preparing the list of parts that need earlier purchasing attention.

**Business question**

Which materials are flagged as long-lead?

**SQL task**

List the long-lead materials.
A long-lead material has is_long_lead equal to true.
Return material_no and description, ordered by material_no.

**Reflect after Check (not graded)**

Treat the result as a watch list, not a shortage list.
Check stock, demand, and confirmed supply before deciding which parts need action.
"""
hints = [
  "Long-lead materials are the rows where is_long_lead is true.",
  "Filter with WHERE is_long_lead = TRUE, then sort.",
  "SELECT material_no, description FROM ___ WHERE is_long_lead = ___ ORDER BY ___",
]
reference_sql = [
  """
  SELECT material_no, description
  FROM material
  WHERE is_long_lead = TRUE
  ORDER BY material_no
  """,
  """
  SELECT description, material_no
  FROM material
  WHERE is_long_lead = TRUE
  ORDER BY material_no ASC
  """,
]
order_matters = true
names_matter = true
excel_tip = "This is like filtering the long-lead column to TRUE and sorting by material number."

[[exercise]]
id = "japan-suppliers"
title = "Suppliers in Japan"
prompt_md = """
**Situation**

Purchasing is organizing a regional supplier review for Japan.

**Business question**

Which suppliers belong on the Japan review list?

**SQL task**

List the suppliers in Japan.
The country column stores JP for Japan.
Return supplier_no and name, ordered by name.

**Reflect after Check (not graded)**

Use the supplier numbers to identify the records to review.
A supplier's country alone does not establish where every part is manufactured or shipped from.
"""
hints = [
  "Japan is stored as the country code JP, not the word Japan.",
  "Filter with WHERE country = 'JP', then sort by name.",
  "SELECT supplier_no, name FROM supplier WHERE country = ___ ORDER BY ___",
]
reference_sql = [
  """
  SELECT supplier_no, name
  FROM supplier
  WHERE country = 'JP'
  ORDER BY name
  """,
  """
  SELECT name, supplier_no
  FROM supplier
  WHERE country = 'JP'
  ORDER BY name ASC
  """,
]
order_matters = true
names_matter = true
excel_tip = "This is like filtering Country to JP and sorting the sheet by name."

[[exercise]]
id = "confirmed-after-today"
title = "Lines confirmed after today"
prompt_md = """
**Situation**

A buyer wants to review larger purchase lines with future delivery confirmations.

**Business question**

Which lines have at least 10 units ordered and a confirmed date after the snapshot?

**SQL task**

From purchase_order_item, list lines confirmed for delivery after DATE '2026-11-01' with order_qty of at least 10.
Return po_no, line_no, material_no, and confirmed_delivery_date.
Order by confirmed_delivery_date, then po_no, then line_no.

**Reflect after Check (not graded)**

The result identifies lines meeting the date and size filters.
Check received quantities before describing any of them as outstanding supply.
"""
hints = [
  "Keep lines whose confirmed date is after today and whose quantity is at least 10.",
  "Use WHERE confirmed_delivery_date > DATE '2026-11-01' AND order_qty >= 10.",
  "SELECT po_no, line_no, material_no, confirmed_delivery_date FROM purchase_order_item WHERE confirmed_delivery_date ___ DATE '2026-11-01' AND order_qty >= ___ ORDER BY confirmed_delivery_date, po_no, line_no",
]
reference_sql = [
  """
  SELECT po_no, line_no, material_no, confirmed_delivery_date
  FROM purchase_order_item
  WHERE confirmed_delivery_date > DATE '2026-11-01'
    AND order_qty >= 10
  ORDER BY confirmed_delivery_date, po_no, line_no
  """,
  """
  SELECT confirmed_delivery_date, material_no, line_no, po_no
  FROM purchase_order_item
  WHERE order_qty >= 10
    AND confirmed_delivery_date >= DATE '2026-11-02'
  ORDER BY confirmed_delivery_date, po_no, line_no
  """,
]
order_matters = true
names_matter = true
excel_tip = "This is like filtering delivery date and quantity, then sorting by date and the two key columns."

[[exercise]]
id = "december-open-lines"
title = "Open lines requested in December 2026"
prompt_md = """
**Situation**

Customer service is preparing a December demand review.

**Business question**

Which open sales lines have a customer-requested date in December 2026?

**SQL task**

List the open sales order lines whose requested_date falls in December 2026.
Open means status is Open.
Use only sales_order_item.
Return so_no, line_no, material_no, qty, and requested_date.
Order by requested_date, then so_no, then line_no.

**Reflect after Check (not graded)**

Use the sorted dates to plan the review.
Requested dates show what customers asked for; compare them with promised dates before describing delivery commitments.
"""
hints = [
  "An open line has status Open, and December 2026 is a range of requested dates.",
  "Filter sales_order_item with status = 'Open' and requested_date in that month.",
  "SELECT so_no, line_no, material_no, qty, requested_date FROM sales_order_item WHERE status = ___ AND requested_date >= ___ AND requested_date < ___ ORDER BY requested_date, so_no, line_no",
]
reference_sql = [
  """
  SELECT so_no, line_no, material_no, qty, requested_date
  FROM sales_order_item
  WHERE status = 'Open'
    AND requested_date >= DATE '2026-12-01'
    AND requested_date < DATE '2027-01-01'
  ORDER BY requested_date, so_no, line_no
  """,
  """
  SELECT requested_date, qty, material_no, line_no, so_no
  FROM sales_order_item
  WHERE status = 'Open'
    AND requested_date BETWEEN DATE '2026-12-01' AND DATE '2026-12-31'
  ORDER BY requested_date, so_no, line_no
  """,
]
order_matters = true
names_matter = true
excel_tip = "This is like filtering Status to Open and Requested date to December 2026, then sorting."

[[exercise]]
id = "rf-generator-search"
title = "Descriptions that mention an RF generator"
prompt_md = """
**Situation**

An operations colleague remembers the phrase RF generator but does not know the material numbers.

**Business question**

Which material descriptions contain that phrase?

**SQL task**

List materials whose description contains the text RF generator.
Use LIKE.
Return material_no and description, ordered by material_no.

**Reflect after Check (not graded)**

Inspect the descriptions before treating every match as the same kind of part.
A text search can also find related kits; verify the exact material before following its supply.
"""
hints = [
  "Contains means the phrase can sit in the middle of the description, not only at the start.",
  "Use LIKE '%RF generator%', with a percent sign on both sides.",
  "SELECT material_no, description FROM material WHERE description LIKE ___ ORDER BY material_no",
]
reference_sql = [
  """
  SELECT material_no, description
  FROM material
  WHERE description LIKE '%RF generator%'
  ORDER BY material_no
  """,
  """
  SELECT description, material_no
  FROM material
  WHERE description LIKE '%RF generator%'
  ORDER BY material_no
  """,
]
order_matters = true
names_matter = true
excel_tip = "This is like a text filter for cells that contain RF generator."

[[exercise]]
id = "highest-net-value"
title = "Ten highest purchase line values"
prompt_md = """
**Situation**

Purchasing wants a short list of large purchase-line values for a commercial review.

**Business question**

Which ten purchase lines have the highest ordered quantity times unit price?

**SQL task**

List the 10 purchase order lines with the highest net value.
Net value is order_qty * net_price, and the column name is net_value.
Return po_no, line_no, material_no, and net_value.
Order by net_value descending, then po_no, then line_no, and keep 10 rows.

**Reflect after Check (not graded)**

Identify the largest line values and use the order numbers for follow-up.
These are calculated order values, not proof of amounts received, invoiced, or paid.
"""
hints = [
  "Net value is quantity times price, and you want the 10 largest.",
  "Name the product with AS, sort with ORDER BY net_value DESC, and stop with LIMIT.",
  "SELECT po_no, line_no, material_no, ___ AS net_value FROM purchase_order_item ORDER BY net_value DESC, po_no, line_no LIMIT ___",
]
reference_sql = [
  """
  SELECT po_no, line_no, material_no, order_qty * net_price AS net_value
  FROM purchase_order_item
  ORDER BY net_value DESC, po_no, line_no
  LIMIT 10
  """,
  """
  SELECT material_no, net_value, line_no, po_no
  FROM (
    SELECT po_no, line_no, material_no, order_qty * net_price AS net_value
    FROM purchase_order_item
  ) AS lines
  ORDER BY 2 DESC, po_no, line_no
  LIMIT 10
  """,
]
order_matters = true
names_matter = true
excel_tip = "This is like a helper column for quantity times price, then a largest-to-smallest sort of the top 10."

[[exercise]]
id = "singapore-lead-time"
title = "Lead times at Singapore"
prompt_md = """
**Situation**

The Singapore planner is reviewing materials with planning lead times of roughly four to six months.

**Business question**

Which SG01 materials have planned lead times between 120 and 180 days?

**SQL task**

From material_plant, list materials at plant SG01 whose planned_lead_time_days is from 120 through 180, including both ends.
Return material_no and planned_lead_time_days.
Order by planned_lead_time_days, then material_no.

**Reflect after Check (not graded)**

Use the list to prioritize a lead-time review.
Compare the planning values with supplier quotes and actual delivery history before proposing changes.
"""
hints = [
  "The range includes 120 and 180, and only plant SG01.",
  "Use WHERE plant_code = 'SG01' AND planned_lead_time_days BETWEEN 120 AND 180.",
  "SELECT material_no, planned_lead_time_days FROM material_plant WHERE plant_code = ___ AND planned_lead_time_days BETWEEN ___ AND ___ ORDER BY planned_lead_time_days, material_no",
]
reference_sql = [
  """
  SELECT material_no, planned_lead_time_days
  FROM material_plant
  WHERE plant_code = 'SG01'
    AND planned_lead_time_days BETWEEN 120 AND 180
  ORDER BY planned_lead_time_days, material_no
  """,
  """
  SELECT planned_lead_time_days, material_no
  FROM material_plant
  WHERE plant_code = 'SG01'
    AND planned_lead_time_days >= 120
    AND planned_lead_time_days <= 180
  ORDER BY planned_lead_time_days, material_no
  """,
]
order_matters = true
names_matter = true
excel_tip = "This is like filtering plant and lead time, then sorting by lead time and material number."
