[[exercise]]
id = "highest-net-value"
title = "Ten highest purchase line values"
prompt_md = """
List the 10 purchase order lines with the highest net value.
Net value is order_qty * net_price, and the column name is net_value.
Return po_no, line_no, material_no, and net_value.
Order by net_value descending, then po_no, then line_no, and keep 10 rows.
"""
hints = [
  "Compute order_qty * net_price and name it net_value.",
  "ORDER BY net_value DESC, po_no, line_no.",
  "LIMIT 10 keeps the first 10 rows after that sort.",
]
reference_sql = [
  """
  SELECT po_no, line_no, material_no, order_qty * net_price AS net_value
  FROM purchase_order_item
  ORDER BY net_value DESC, po_no, line_no
  LIMIT 10
  """,
  """
  SELECT material_no, net_value, line_no, po_no
  FROM (
    SELECT po_no, line_no, material_no, order_qty * net_price AS net_value
    FROM purchase_order_item
  ) AS lines
  ORDER BY 2 DESC, po_no, line_no
  LIMIT 10
  """,
]
order_matters = true
names_matter = true
excel_tip = "This is like a helper column for quantity times price, then a largest-to-smallest sort of the top 10."

[[exercise]]
id = "singapore-lead-time"
title = "Lead times at Singapore"
prompt_md = """
From material_plant, list materials at plant SG01 whose planned_lead_time_days is from 120 through 180, including both ends.
Return material_no and planned_lead_time_days.
Order by planned_lead_time_days, then material_no.
"""
hints = [
  "Filter plant_code = 'SG01'.",
  "BETWEEN 120 AND 180 includes both ends and drops blank lead times.",
  "ORDER BY planned_lead_time_days, material_no.",
]
reference_sql = [
  """
  SELECT material_no, planned_lead_time_days
  FROM material_plant
  WHERE plant_code = 'SG01'
    AND planned_lead_time_days BETWEEN 120 AND 180
  ORDER BY planned_lead_time_days, material_no
  """,
  """
  SELECT planned_lead_time_days, material_no
  FROM material_plant
  WHERE plant_code = 'SG01'
    AND planned_lead_time_days >= 120
    AND planned_lead_time_days <= 180
  ORDER BY planned_lead_time_days, material_no
  """,
]
order_matters = true
names_matter = true
excel_tip = "This is like filtering plant and lead time, then sorting by lead time and material number."
