[[exercise]]
id = "long-lead-materials"
title = "Long-lead materials"
prompt_md = """
List the long-lead materials.
A long-lead material has is_long_lead equal to true.
Return material_no and description, ordered by material_no.
"""
hints = [
  "The table name is material.",
  "Filter with is_long_lead = TRUE.",
  "Select material_no and description, then ORDER BY material_no.",
]
reference_sql = [
  """
  SELECT material_no, description
  FROM material
  WHERE is_long_lead = TRUE
  ORDER BY material_no
  """,
  """
  SELECT description, material_no
  FROM material
  WHERE is_long_lead = TRUE
  ORDER BY material_no ASC
  """,
]
order_matters = true
names_matter = true
excel_tip = "This is like filtering the long-lead column to TRUE and sorting by material number."

