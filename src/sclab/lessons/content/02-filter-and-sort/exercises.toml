[[exercise]]
id = "confirmed-after-today"
title = "Lines confirmed after today"
prompt_md = """
From purchase_order_item, list lines confirmed for delivery after DATE '2026-11-01' with order_qty of at least 10.
Return po_no, line_no, material_no, and confirmed_delivery_date.
Order by confirmed_delivery_date, then po_no, then line_no.
"""
hints = [
  "A blank confirmed_delivery_date fails a greater-than test, so those rows drop out.",
  "Require confirmed_delivery_date > DATE '2026-11-01' and order_qty >= 10.",
  "ORDER BY confirmed_delivery_date, po_no, line_no.",
]
reference_sql = [
  """
  SELECT po_no, line_no, material_no, confirmed_delivery_date
  FROM purchase_order_item
  WHERE confirmed_delivery_date > DATE '2026-11-01'
    AND order_qty >= 10
  ORDER BY confirmed_delivery_date, po_no, line_no
  """,
  """
  SELECT confirmed_delivery_date, material_no, line_no, po_no
  FROM purchase_order_item
  WHERE order_qty >= 10
    AND confirmed_delivery_date >= DATE '2026-11-02'
  ORDER BY confirmed_delivery_date, po_no, line_no
  """,
]
order_matters = true
names_matter = true
excel_tip = "This is like filtering delivery date and quantity, then sorting by date and the two key columns."

[[exercise]]
id = "halcyon-open-lines"
title = "Open lines for Halcyon Memory"
prompt_md = """
List the open sales order lines for customer C-2003, Halcyon Memory.
Open means status is Open.
customer_no is on sales_order, and the line columns are on sales_order_item.
Return so_no, line_no, material_no, qty, and requested_date.
Order by requested_date, then so_no, then line_no.
"""
hints = [
  "Keep lines where status = 'Open'.",
  "Join sales_order_item to sales_order on so_no so you can test customer_no.",
  "Filter customer_no = 'C-2003', then ORDER BY requested_date, so_no, line_no.",
]
reference_sql = [
  """
  SELECT i.so_no, i.line_no, i.material_no, i.qty, i.requested_date
  FROM sales_order_item AS i
  JOIN sales_order AS h ON h.so_no = i.so_no
  WHERE h.customer_no = 'C-2003'
    AND i.status = 'Open'
  ORDER BY requested_date, so_no, line_no
  """,
  """
  SELECT h.so_no, i.line_no, i.material_no, i.qty, i.requested_date
  FROM sales_order AS h
  JOIN sales_order_item AS i ON i.so_no = h.so_no
  WHERE i.status = 'Open'
    AND h.customer_no = 'C-2003'
  ORDER BY i.requested_date, i.so_no, i.line_no
  """,
]
order_matters = true
names_matter = true
excel_tip = "The customer sits on the order sheet, so this filter looks up the header before sorting the lines."

