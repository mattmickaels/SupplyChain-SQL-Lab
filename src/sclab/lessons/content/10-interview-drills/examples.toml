[[fact]]
id = "excess-top-ten-value"
sql = """
WITH stock AS (
    SELECT material_no, SUM(qty_on_hand) AS qty
    FROM inventory GROUP BY material_no HAVING SUM(qty_on_hand) > 0
), valued AS (
    SELECT s.material_no, ROUND(s.qty * q.unit_price, 2) AS value
    FROM stock s JOIN material_supplier q ON q.material_no = s.material_no AND q.is_primary
    WHERE NOT EXISTS (
        SELECT 1 FROM stock_movement u WHERE u.material_no = s.material_no
          AND u.movement_type IN ('261', '601')
          AND u.posting_date >= DATE '2025-11-01' AND u.posting_date < DATE '2026-11-01'
    )
), ranked AS (
    SELECT material_no, value,
           ROW_NUMBER() OVER (ORDER BY value DESC, material_no) AS position
    FROM valued
)
SELECT SUM(value) FROM ranked WHERE position <= 10
"""
expected = 1063696.15
