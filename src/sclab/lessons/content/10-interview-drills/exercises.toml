[[exercise]]
id = "drill-late-suppliers"
title = "Who drives late receipts?"
prompt_md = """
Which suppliers drove late receipt events in the last 12 months, and how concentrated is it?
Use receipt_date from DATE '2025-11-01' inclusive to DATE '2026-11-01' exclusive.
A receipt event is late when receipt_date > confirmed_delivery_date; omit NULL confirmations and count each goods_receipt event once, not PO lines or units.
Return every supplier with late events: supplier_no, supplier_name, late_receipts, share_pct, cumulative_pct.
Percentages use all late events as denominator and are rounded to 2 decimals.
Sort by late_receipts descending then supplier_no; use that same order for the cumulative percentage.
"""
hints = [
  "Define lateness and the event grain before ranking suppliers.",
  "Aggregate late receipts by supplier, then use total and running window sums for concentration.",
  "WITH late AS (SELECT ___, COUNT(*) AS late_receipts FROM ___ WHERE ___ GROUP BY ___) SELECT ___, ROUND(100.0 * ___ / SUM(___) OVER (), 2), ___ FROM late ORDER BY ___"
]
reference_sql = ["""
WITH late AS (
    SELECT h.supplier_no, s.name AS supplier_name, COUNT(*) AS late_receipts
    FROM goods_receipt g JOIN purchase_order_item i ON i.po_no = g.po_no AND i.line_no = g.line_no
    JOIN purchase_order h ON h.po_no = i.po_no JOIN supplier s ON s.supplier_no = h.supplier_no
    WHERE g.receipt_date >= DATE '2025-11-01' AND g.receipt_date < DATE '2026-11-01'
      AND g.receipt_date > i.confirmed_delivery_date
    GROUP BY h.supplier_no, s.name
)
SELECT supplier_no, supplier_name, late_receipts,
       ROUND(100.0 * late_receipts / SUM(late_receipts) OVER (), 2) AS share_pct,
       ROUND(100.0 * SUM(late_receipts) OVER (ORDER BY late_receipts DESC, supplier_no
             ROWS UNBOUNDED PRECEDING) / SUM(late_receipts) OVER (), 2) AS cumulative_pct
FROM late ORDER BY late_receipts DESC, supplier_no
"""]
order_matters = true
names_matter = true
excel_tip = "Make a supplier Pareto pivot with a running percentage."
time_limit_s = 900
summary_prompt = "Summarize which suppliers account for late receipt events in the last 12 months, and whether that concentration is enough to focus a recovery plan."
model_summary = """
Harbor Precision Assemblies led with 82 late receipt events (1.86%); the top 10 supplied 694 of 4404 (15.76%) in Nov 2025-Oct 2026.
Late events are spread across 136 suppliers; this is an event count, not a quantity or supplier late-rate ranking.
Review the top contributors and their receipt volumes before assigning supplier recovery actions.
"""
summary_checklist = ["Names the number that matters", "States the date window and scope", "Separates evidence from inference", "Recommends an action", "Three lines or fewer"]

[[exercise]]
id = "drill-halcyon-demand"
title = "Is Halcyon demand real?"
prompt_md = """
Assess whether Halcyon Memory's Etch increase is backed by real bookings, and separately report the forward Etch forecast change.
Return one row: booked_2025, booked_2026, booking_growth_pct, forecast_09, forecast_10, forecast_growth_pct.
Include cancelled lines.
A tool line is booked on the order date even when status is later Cancelled.
Sum ETC TOOL quantity for customer C-2003, not COUNT(*) of the lines.
The windows are July 1 through October 31 of each year (DATE '2025-07-01' to DATE '2025-11-01' exclusive, and DATE '2026-07-01' to DATE '2026-11-01' exclusive).
Forecast totals cover November 2026 through January 2027 (DATE '2026-11-01' inclusive to DATE '2027-02-01' exclusive), ETC TOOLs, versions 2026-09 and 2026-10.
Both growth percentages are 100 times (new minus old) divided by old, rounded to 2 decimals, NULL for a zero denominator.
The forecast has no customer key: do not attribute its family-wide increase to Halcyon or directly compare the two different windows as coverage.
"""
hints = [
  "Use booking dates for real orders; the forecast is a separate family-level signal.",
  "Build one conditional-total CTE for Halcyon bookings and another for Etch forecast versions.",
  "WITH bookings AS (SELECT SUM(CASE WHEN ___ THEN ___ ELSE 0 END) AS booked_2025, ___ FROM ___ WHERE ___), forecast AS (___) SELECT ___, ROUND(100.0 * (___ - ___) / NULLIF(___, 0), 2), ___ FROM bookings CROSS JOIN forecast"
]
reference_sql = ["""
WITH bookings AS (
    SELECT SUM(CASE WHEN h.order_date >= DATE '2025-07-01' AND h.order_date < DATE '2025-11-01'
                    THEN i.qty ELSE 0 END) AS booked_2025,
           SUM(CASE WHEN h.order_date >= DATE '2026-07-01' AND h.order_date < DATE '2026-11-01'
                    THEN i.qty ELSE 0 END) AS booked_2026
    FROM sales_order_item i JOIN sales_order h ON h.so_no = i.so_no
    JOIN material m ON m.material_no = i.material_no
    WHERE h.customer_no = 'C-2003' AND m.material_type = 'TOOL' AND m.family_code = 'ETC'
), forecast AS (
    SELECT SUM(CASE WHEN f.forecast_version = '2026-09' THEN f.qty ELSE 0 END) AS forecast_09,
           SUM(CASE WHEN f.forecast_version = '2026-10' THEN f.qty ELSE 0 END) AS forecast_10
    FROM demand_forecast f JOIN material m ON m.material_no = f.material_no
    WHERE m.material_type = 'TOOL' AND m.family_code = 'ETC'
      AND f.forecast_month >= DATE '2026-11-01' AND f.forecast_month < DATE '2027-02-01'
      AND f.forecast_version IN ('2026-09', '2026-10')
)
SELECT b.booked_2025, b.booked_2026,
       ROUND(100.0 * (b.booked_2026 - b.booked_2025) / NULLIF(b.booked_2025, 0), 2) AS booking_growth_pct,
       f.forecast_09, f.forecast_10,
       ROUND(100.0 * (f.forecast_10 - f.forecast_09) / NULLIF(f.forecast_09, 0), 2) AS forecast_growth_pct
FROM bookings b CROSS JOIN forecast f
"""]
order_matters = false
names_matter = true
excel_tip = "Compare same-season booking pivots year over year, with a separate forecast-version pivot."
time_limit_s = 900
summary_prompt = "Summarize whether Halcyon's Jul-Oct Etch bookings rose, and what the separate Nov-Jan Etch forecast change does and does not prove."
model_summary = """
Halcyon Etch bookings rose from 19 to 43 units in Jul-Oct year over year, up 126.32%, so the increase includes real orders.
The separate Nov-Jan Etch forecast doubled from 30 to 60 units; it has no customer key and cannot be assigned to Halcyon.
Validate customer delivery priorities and reconcile family capacity to the increased forward plan.
"""
summary_checklist = ["Names the number that matters", "States the date window and scope", "Separates evidence from inference", "Recommends an action", "Three lines or fewer"]

[[exercise]]
id = "drill-bay-bottleneck"
title = "Which bay is the bottleneck?"
prompt_md = """
For this drill, next quarter means the planning quarter DATE '2026-12-01' inclusive through DATE '2027-03-01' exclusive.
Use the weekly start-slot method from lesson 9, including all 13 ISO weeks from DATE '2026-11-30' through DATE '2027-02-22', zero-load bay-weeks and full slots in boundary weeks.
Return one row per bay: bay_id, total_starts, total_slots (weekly_slots times all 13 calendar weeks), excess_starts (sum of positive weekly starts minus slots), load_pct (100 times total starts / total slots, rounded to 2 decimals).
family_code on build_bay shows which bays can build the same tools.
Each production order is one start slot.
Count only status Planned or Released, and only when planned_start is after 1 November 2026.
A Released order that already started on or before the snapshot is treated as already issued and is excluded.
This quarter begins on 1 December 2026, so that date rule is already inside the window.
Sort by load_pct descending then bay_id and return all bays.
Use excess_starts to describe how many starts need moving, even when average utilization hides peak weeks.
"""
hints = [
  "Include quiet weeks, and count only Planned or Released starts after 1 November 2026.",
  "Make the bay-week grid first; sum positive weekly overload rather than netting peaks against spare weeks.",
  "WITH RECURSIVE weeks(level) AS (___), calendar AS (___), loads AS (___), grid AS (___) SELECT bay_id, SUM(___), SUM(___), SUM(CASE WHEN ___ THEN ___ ELSE 0 END), ROUND(___, 2) AS load_pct FROM grid GROUP BY ___ ORDER BY ___"
]
reference_sql = ["""
WITH RECURSIVE weeks(level) AS (
    SELECT 0
    UNION ALL
    SELECT level + 1 FROM weeks WHERE level < 12
), calendar AS (
    SELECT CAST(DATE '2026-11-30' + level * INTERVAL 7 DAY AS DATE) AS week_start
    FROM weeks
), loads AS (
    SELECT bay_id, CAST(date_trunc('week', planned_start) AS DATE) AS week_start,
           COUNT(*) AS starts
    FROM production_order
    WHERE status IN ('Planned', 'Released')
      AND planned_start > DATE '2026-11-01'
      AND planned_start >= DATE '2026-12-01' AND planned_start < DATE '2027-03-01'
    GROUP BY bay_id, CAST(date_trunc('week', planned_start) AS DATE)
), grid AS (
    SELECT b.bay_id, w.week_start, COALESCE(l.starts, 0) AS starts, b.weekly_slots
    FROM build_bay b CROSS JOIN calendar w
    LEFT JOIN loads l ON l.bay_id = b.bay_id AND l.week_start = w.week_start
)
SELECT bay_id, SUM(starts) AS total_starts, SUM(weekly_slots) AS total_slots,
       SUM(CASE WHEN starts > weekly_slots THEN starts - weekly_slots ELSE 0 END) AS excess_starts,
       ROUND(100.0 * SUM(starts) / SUM(weekly_slots), 2) AS load_pct
FROM grid GROUP BY bay_id ORDER BY load_pct DESC, bay_id
"""]
order_matters = true
names_matter = true
excel_tip = "Pivot the complete bay-week grid and keep a separate positive-overload column."
databricks_note = "On this query, `date_trunc('week', planned_start)` is written `date_trunc('WEEK', planned_start)` on Databricks, and `DATE '2026-11-30' + level * INTERVAL 7 DAY` is a whole-day interval."
time_limit_s = 900
summary_prompt = "Summarize which bay is overloaded in Dec-Feb, and whether a same-family bay at that plant has spare slots for rebalancing."
model_summary = """
SC01-B3, an Etch bay with 6 slots a week, is at 133.33 percent on Planned and Released starts: 104 starts against 78 slots, with 26 starts above the weekly caps.
SC01-B2 is the other Etch bay at SC01, with 4 slots a week, 34 starts, 52 slots, and 65.38 percent load, and some weeks still have open slots.
Rebalance Etch starts from SC01-B3 onto SC01-B2 in the weeks B2 is not already full.
"""
summary_checklist = ["Names the number that matters", "States the date window and scope", "Separates evidence from inference", "Recommends an action", "Three lines or fewer"]

[[exercise]]
id = "drill-spare-otd"
title = "Spare-part delivery by segment"
prompt_md = """
Measure spare-part on-time delivery by customer segment for shipped COMPONENT sales lines with shipped_date from DATE '2025-11-01' inclusive to DATE '2026-11-01' exclusive.
Include only status Shipped and non-NULL promised_date and shipped_date.
Return segment, shipped_lines, on_time_lines, on_time_pct (100 times on-time lines / shipped lines, rounded to 2 decimals), sorted by segment.
On time means shipped_date <= promised_date; count lines rather than units and use the shipment window rather than the booking window.
"""
hints = [
  "Choose the shipment population before measuring its on-time share.",
  "Join customer for segment, then use a CASE sum for shipments on or before promise.",
  "SELECT c.segment, COUNT(*) AS shipped_lines, SUM(CASE WHEN ___ THEN 1 ELSE 0 END) AS on_time_lines, ROUND(___, 2) AS on_time_pct FROM ___ WHERE ___ GROUP BY ___ ORDER BY ___"
]
reference_sql = ["""
SELECT c.segment, COUNT(*) AS shipped_lines,
       SUM(CASE WHEN i.shipped_date <= i.promised_date THEN 1 ELSE 0 END) AS on_time_lines,
       ROUND(100.0 * SUM(CASE WHEN i.shipped_date <= i.promised_date THEN 1 ELSE 0 END)
             / COUNT(*), 2) AS on_time_pct
FROM sales_order_item i JOIN sales_order h ON h.so_no = i.so_no
JOIN customer c ON c.customer_no = h.customer_no JOIN material m ON m.material_no = i.material_no
WHERE m.material_type = 'COMPONENT' AND i.status = 'Shipped' AND i.promised_date IS NOT NULL
  AND i.shipped_date >= DATE '2025-11-01' AND i.shipped_date < DATE '2026-11-01'
GROUP BY c.segment ORDER BY c.segment
"""]
order_matters = true
names_matter = true
excel_tip = "A segment pivot with a 1/0 on-time helper column gives counts and rates."
time_limit_s = 900
summary_prompt = "Summarize spare-part on-time delivery by segment for the last 12 months, and which segment the service team should review first."
model_summary = """
Nov 2025-Oct 2026 spare-line OTD was Foundry 92.04% (1838/1997), Logic 82.16% (1326/1614), and Memory 70.05% (994/1419).
Memory trails Foundry by 21.99 percentage points; shipment cohorts show a service gap, not its cause.
Review late Memory shipments by material and supplier, then prioritize recovery with the service team.
"""
summary_checklist = ["Names the number that matters", "States the date window and scope", "Separates evidence from inference", "Recommends an action", "Three lines or fewer"]

[[exercise]]
id = "drill-excess-inventory"
title = "Where is idle inventory value?"
prompt_md = """
Find the 10 materials with the highest positive on-hand value at DATE '2026-11-01' and no usage in the last 12 months.
Aggregate inventory over all plants and storage locations before pricing at material_supplier.unit_price for is_primary = true.
No usage means no stock_movement of type 261 or 601 with posting_date from DATE '2025-11-01' inclusive to DATE '2026-11-01' exclusive; receipts and opening stock are not usage.
Return material_no, description, on_hand_qty, on_hand_value (quantity times primary quote price, rounded to 2 decimals).
Sort by on_hand_value descending then material_no ascending to break ties; return exactly 10 rows.
"""
hints = [
  "Receiving a part is not using it; look specifically for production issues or shipments.",
  "Aggregate stock, join only the primary quote, and use NOT EXISTS for usage in the date window.",
  "WITH stock AS (___) SELECT ___, ROUND(___ * ___, 2) AS on_hand_value FROM ___ WHERE NOT EXISTS (SELECT 1 FROM ___ WHERE ___) ORDER BY ___ DESC, ___ LIMIT ___"
]
reference_sql = ["""
WITH stock AS (
    SELECT material_no, SUM(qty_on_hand) AS on_hand_qty FROM inventory
    GROUP BY material_no HAVING SUM(qty_on_hand) > 0
)
SELECT m.material_no, m.description, s.on_hand_qty,
       ROUND(s.on_hand_qty * q.unit_price, 2) AS on_hand_value
FROM stock s JOIN material m ON m.material_no = s.material_no
JOIN material_supplier q ON q.material_no = s.material_no AND q.is_primary = true
WHERE NOT EXISTS (
    SELECT 1 FROM stock_movement u WHERE u.material_no = s.material_no
      AND u.movement_type IN ('261', '601')
      AND u.posting_date >= DATE '2025-11-01' AND u.posting_date < DATE '2026-11-01'
)
ORDER BY on_hand_value DESC, m.material_no LIMIT 10
"""]
order_matters = true
names_matter = true
excel_tip = "Sum stock once per material, XLOOKUP the primary price, and filter out recent usage."
time_limit_s = 900
summary_prompt = "Summarize the idle on-hand value in the top 10 unused materials, and what to check before writing that stock off."
model_summary = """
The top 10 materials with no usage in Nov 2025-Oct 2026 hold 1063696.15 of stock at the snapshot.
M-005409 leads at 213618.60 for 17 units; this uses a primary-source quote rather than an accounting valuation.
Check forward service demand and disposition options for these ten before reducing purchases or writing stock off.
"""
summary_checklist = ["Names the number that matters", "States the date window and scope", "Separates evidence from inference", "Recommends an action", "Three lines or fewer"]

[[exercise]]
id = "drill-single-source"
title = "Single-source dependency exposure"
prompt_md = """
Find long-lead COMPONENT materials with exactly one supplier quote and demand from open TOOL sales lines as of DATE '2026-11-01'.
Explode each tool's BOM through all paths with a level < 10 guard, multiplying quantities and summing repeated component paths.
Include open sales lines booked on or before the snapshot, regardless of promised date; no production-order join is needed.
Return material_no, supplier_no, open_component_qty (sum of line quantity times exploded quantity), dependent_lines (distinct sales lines), exposed_revenue (sum of qty times sales unit_price for those lines, rounded to 2 decimals).
Count each sales line's revenue once per component, not once per BOM path.
Sort by exposed_revenue descending then material_no.
This is dependency exposure, not a shortage prediction; one order may depend on several parts, so revenue is not additive across result rows.
"""
hints = [
  "Supplier count belongs at material grain; revenue belongs at sales-line grain.",
  "Roll up BOM paths first, restrict to one-quote materials, then join each open tool sales line once per component.",
  "WITH RECURSIVE tree AS (___), leaves AS (___), single_source AS (SELECT ___ FROM ___ GROUP BY ___ HAVING COUNT(*) = ___), dependencies AS (___) SELECT ___, SUM(___), COUNT(*), ROUND(SUM(___), 2) FROM ___ GROUP BY ___ ORDER BY ___"
]
reference_sql = ["""
WITH RECURSIVE tree AS (
    SELECT m.material_no AS root, m.family_code, b.component_material_no AS material_no,
           CAST(b.qty_per AS DECIMAL(20,6)) AS qty, 1 AS level
    FROM material m JOIN bom_item b ON b.parent_material_no = m.material_no
    WHERE m.material_type = 'TOOL'
    UNION ALL
    SELECT t.root, t.family_code, b.component_material_no,
           CAST(t.qty * b.qty_per AS DECIMAL(20,6)), t.level + 1
    FROM tree t JOIN bom_item b ON b.parent_material_no = t.material_no
    WHERE t.level < 10
), leaves AS (
    SELECT t.root, t.family_code, t.material_no, SUM(t.qty) AS qty
    FROM tree t JOIN material m ON m.material_no = t.material_no
    WHERE m.material_type = 'COMPONENT'
    GROUP BY t.root, t.family_code, t.material_no
), single_source AS (
    SELECT material_no, MIN(supplier_no) AS supplier_no FROM material_supplier
    GROUP BY material_no HAVING COUNT(*) = 1
), dependencies AS (
    SELECT l.material_no, i.so_no, i.line_no, i.qty * l.qty AS component_qty,
           i.qty * i.unit_price AS revenue
    FROM leaves l JOIN sales_order_item i ON i.material_no = l.root
    JOIN sales_order h ON h.so_no = i.so_no
    WHERE i.status = 'Open' AND h.order_date <= DATE '2026-11-01'
)
SELECT d.material_no, s.supplier_no, SUM(d.component_qty) AS open_component_qty,
       COUNT(*) AS dependent_lines, ROUND(SUM(d.revenue), 2) AS exposed_revenue
FROM dependencies d JOIN single_source s ON s.material_no = d.material_no
JOIN material m ON m.material_no = d.material_no
WHERE m.is_long_lead = true AND m.material_type = 'COMPONENT'
GROUP BY d.material_no, s.supplier_no ORDER BY exposed_revenue DESC, d.material_no
"""]
order_matters = true
names_matter = true
excel_tip = "Use a where-used table to connect open order value to each single-source component."
time_limit_s = 900
summary_prompt = "Summarize the largest single-source long-lead exposure on open tool orders, and why those revenue figures are not a shortage total."
model_summary = """
M-001324 depends on V-10017 for 233 component units across 43 open tool lines, exposing 286059500.00 in sales value.
The result contains 12 single-source long-lead dependencies; exposure overlaps across parts and does not prove a shortage or lost revenue.
Review RF supply coverage and qualification of alternative sources before committing additional customer demand.
"""
summary_checklist = ["Names the number that matters", "States the date window and scope", "Separates evidence from inference", "Recommends an action", "Three lines or fewer"]
