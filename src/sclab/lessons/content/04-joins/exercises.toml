[[exercise]]
id = "join-october-po-supplier"
title = "October purchase orders with the supplier name"
prompt_md = """
**Situation**

A buyer has an October order-line extract, but supplier codes alone are difficult to discuss in a review.

**Business question**

Which supplier name belongs to each purchase line placed in October 2026?

**SQL task**

List purchase order lines placed in October 2026.
October is order_date from 1 October 2026 through 31 October 2026.
Return po_no, line_no, and supplier_name.
The supplier name is on supplier, and the supplier number is on purchase_order.
Order by po_no, then line_no.

**Reflect after Check (not graded)**

Confirm that each output row still represents one purchase line.
Use the names for the review while retaining order and line identifiers for follow-up.
"""
hints = [
  "The supplier name is a lookup from the supplier number on the purchase order header.",
  "Join purchase_order_item to purchase_order on po_no, then supplier on supplier_no, and filter October 2026.",
  "SELECT i.po_no, i.line_no, s.name AS ___ FROM purchase_order_item AS i JOIN purchase_order AS h ON ___ JOIN supplier AS s ON ___ WHERE h.order_date >= ___ AND h.order_date <= ___ ORDER BY i.po_no, i.line_no",
]
reference_sql = [
  """
SELECT i.po_no, i.line_no, s.name AS supplier_name
FROM purchase_order_item AS i
JOIN purchase_order AS h ON h.po_no = i.po_no
JOIN supplier AS s ON s.supplier_no = h.supplier_no
WHERE h.order_date >= DATE '2026-10-01'
  AND h.order_date <= DATE '2026-10-31'
ORDER BY i.po_no, i.line_no
""",
]
order_matters = true
names_matter = true
excel_tip = "VLOOKUP the supplier name from the supplier sheet using the supplier number."

[[exercise]]
id = "join-long-lead-without-open-po"
title = "Long-lead materials with no open purchase line"
prompt_md = """
**Situation**

A planner wants a first-pass supply screen rather than a complete shortage calculation.

**Business question**

Which long-lead materials have no purchase line meeting this exercise's future-confirmation rule?

**SQL task**

Find long-lead materials that have no open purchase order line.
A line is open here when confirmed_delivery_date is on or after 1 November 2026.
Return material_no and description.
Order by material_no.
Use a LEFT JOIN and keep the rows where the purchase line is NULL.
Some material descriptions are copies that end with a trailing space.
Leave those copies out.
A trailing space is not a second material that lacks supply.

**Reflect after Check (not graded)**

Explain the rule used to build this list.
Check receipts, overdue supply, stock, and demand before concluding that a material has no supply or needs a new order.
"""
hints = [
  "A long-lead material with no confirmed line on or after today shows up as a failed lookup.",
  "LEFT JOIN purchase_order_item on material_no and confirmed_delivery_date >= DATE '2026-11-01', then keep i.po_no IS NULL.",
  "SELECT m.material_no, m.description FROM material AS m LEFT JOIN purchase_order_item AS i ON ___ WHERE m.is_long_lead = ___ AND i.po_no ___ AND m.description NOT LIKE ___ ORDER BY m.material_no",
]
reference_sql = [
  """
SELECT m.material_no, m.description
FROM material AS m
LEFT JOIN purchase_order_item AS i
  ON i.material_no = m.material_no
 AND i.confirmed_delivery_date >= DATE '2026-11-01'
WHERE m.is_long_lead = true
  AND i.po_no IS NULL
  AND m.description NOT LIKE '% '
ORDER BY m.material_no
""",
]
order_matters = true
names_matter = true
excel_tip = "This is a VLOOKUP that you keep only when the lookup fails."

[[exercise]]
id = "join-open-sales-lines"
title = "Open sales lines with names"
prompt_md = """
**Situation**

Customer service needs an open-order report that colleagues can read without looking up codes.

**Business question**

Who is the customer, and what material is on each open sales line?

**SQL task**

List open sales order lines with the customer name and the material description.
Open means status = 'Open'.
The customer number is on the sales order header, not on the line.
Return so_no, line_no, customer_name, and description.
Order by so_no, then line_no.

**Reflect after Check (not graded)**

Use the customer name and material description to explain a line, but keep its order and line number as the identifier.
Names alone may not uniquely identify a record.
"""
hints = [
  "The customer name and the material description each need their own lookup.",
  "Join the line to sales_order, that header to customer, and the line to material, then keep status = 'Open'.",
  "SELECT i.so_no, i.line_no, c.name AS ___, m.description FROM sales_order_item AS i JOIN sales_order AS h ON ___ JOIN customer AS c ON ___ JOIN material AS m ON ___ WHERE i.status = ___ ORDER BY i.so_no, i.line_no",
]
reference_sql = [
  """
SELECT i.so_no, i.line_no, c.name AS customer_name, m.description
FROM sales_order_item AS i
JOIN sales_order AS h ON h.so_no = i.so_no
JOIN customer AS c ON c.customer_no = h.customer_no
JOIN material AS m ON m.material_no = i.material_no
WHERE i.status = 'Open'
ORDER BY i.so_no, i.line_no
""",
]
order_matters = true
names_matter = true
excel_tip = "The line needs two lookups: the customer name from the header, and the material description."

[[exercise]]
id = "join-halcyon-open-lines"
title = "Open lines for Halcyon Memory"
prompt_md = """
**Situation**

The account team is preparing for a backlog call with Halcyon Memory.

**Business question**

Which Halcyon sales lines are open, and when did the customer request them?

**SQL task**

List the open sales order lines for Halcyon Memory, customer C-2003.
Open means status = 'Open'.
The customer number is on sales_order, not on the line.
Return so_no, line_no, material_no, qty, and requested_date.
Order by requested_date, then so_no, then line_no.

**Reflect after Check (not graded)**

Use the requested dates to organize the conversation.
Check promised dates and fulfillment status before giving Halcyon a delivery update.
"""
hints = [
  "Halcyon Memory is customer C-2003, and an open line has status Open.",
  "Join sales_order_item to sales_order on so_no, then filter customer_no and status.",
  "SELECT i.so_no, i.line_no, i.material_no, i.qty, i.requested_date FROM sales_order_item AS i JOIN sales_order AS h ON ___ WHERE h.customer_no = ___ AND i.status = ___ ORDER BY i.requested_date, i.so_no, i.line_no",
]
reference_sql = [
  """
SELECT i.so_no, i.line_no, i.material_no, i.qty, i.requested_date
FROM sales_order_item AS i
JOIN sales_order AS h ON h.so_no = i.so_no
WHERE h.customer_no = 'C-2003'
  AND i.status = 'Open'
ORDER BY i.requested_date, i.so_no, i.line_no
""",
]
order_matters = true
names_matter = true
excel_tip = "Filter the order header to customer C-2003, then list the open lines sorted by requested date."

[[exercise]]
id = "join-open-rf-po-lines"
title = "Open RF generator purchase lines"
prompt_md = """
**Situation**

The planner responsible for RF components needs a supplier follow-up list.

**Business question**

Which RF generator purchase lines still have quantity outstanding, and who supplies them?

**SQL task**

List purchase order lines for materials whose description starts with RF generator, including the comma so the spare kit stays out.
The order was placed on or before 1 November 2026.
Received quantity is below order_qty.
A line with no goods receipt counts as received quantity 0.
A fully received line stays out.
Return po_no, line_no, supplier_name, and confirmed_delivery_date.
Order by confirmed_delivery_date, then po_no, then line_no.

**Reflect after Check (not graded)**

The confirmation dates help organize follow-up.
A missing or overdue confirmation needs clarification; do not assume every outstanding line will arrive on time.
"""
hints = [
  "An open RF generator line is not fully received. A missing receipt counts as zero. The description starts with RF generator, and a comma.",
  "Sum goods_receipt.qty by po_no and line_no before comparing it with order_qty, and join supplier for the name.",
  "SELECT i.po_no, i.line_no, s.name AS ___, i.confirmed_delivery_date FROM purchase_order_item AS i JOIN purchase_order AS h ON ___ JOIN supplier AS s ON ___ JOIN material AS m ON ___ LEFT JOIN (SELECT po_no, line_no, SUM(___) AS received_qty FROM goods_receipt GROUP BY po_no, line_no) AS r ON ___ WHERE m.description LIKE ___ AND h.order_date <= ___ AND COALESCE(r.received_qty, 0) < ___ ORDER BY i.confirmed_delivery_date, i.po_no, i.line_no",
]
reference_sql = [
  """
SELECT i.po_no, i.line_no, s.name AS supplier_name, i.confirmed_delivery_date
FROM purchase_order_item AS i
JOIN purchase_order AS h ON h.po_no = i.po_no
JOIN supplier AS s ON s.supplier_no = h.supplier_no
JOIN material AS m ON m.material_no = i.material_no
LEFT JOIN (
    SELECT po_no, line_no, sum(qty) AS received_qty
    FROM goods_receipt
    GROUP BY po_no, line_no
) AS r ON r.po_no = i.po_no AND r.line_no = i.line_no
WHERE m.description LIKE 'RF generator,%'
  AND h.order_date <= DATE '2026-11-01'
  AND coalesce(r.received_qty, 0) < i.order_qty
ORDER BY i.confirmed_delivery_date, i.po_no, i.line_no
""",
]
order_matters = true
names_matter = true
excel_tip = "Filter to RF generator, then look up the supplier name and keep lines that are not fully received."

[[exercise]]
id = "join-multi-receipt-qty"
title = "Received quantity when a line has several receipts"
prompt_md = """
**Situation**

Receiving has posted several deliveries against each of a few purchase lines, and a report is repeating the ordered quantity.

**Business question**

What was ordered and received on each line without multiplying the order quantity?

**SQL task**

Show order quantity and received quantity for these purchase orders.
The orders are PO-0000003, PO-0000006, PO-0000009, PO-0000013, and PO-0000016.
Each order has one line, and that line has three goods receipts.
Return po_no, line_no, order_qty, and received_qty.
received_qty is the sum of goods_receipt.qty for that line, or 0 when nothing has been received.
Order by po_no, then line_no.
Add the receipts up before you join them, so order_qty is not repeated once per receipt.

**Reflect after Check (not graded)**

Compare one ordered quantity with the total receipts for that line.
If a report repeats the order quantity for every receipt, fix the join before using its totals.
"""
hints = [
  "These lines have three receipts each, so joining the receipts first would repeat order_qty.",
  "SUM goods_receipt.qty in a derived table grouped by po_no and line_no, then LEFT JOIN it.",
  "SELECT i.po_no, i.line_no, i.order_qty, COALESCE(r.received_qty, 0) AS ___ FROM purchase_order_item AS i LEFT JOIN (SELECT po_no, line_no, SUM(___) AS received_qty FROM goods_receipt GROUP BY ___) AS r ON ___ WHERE i.po_no IN (___) ORDER BY i.po_no, i.line_no",
]
reference_sql = [
  """
SELECT i.po_no, i.line_no, i.order_qty, COALESCE(r.received_qty, 0) AS received_qty
FROM purchase_order_item AS i
LEFT JOIN (
    SELECT po_no, line_no, SUM(qty) AS received_qty
    FROM goods_receipt
    GROUP BY po_no, line_no
) AS r ON r.po_no = i.po_no AND r.line_no = i.line_no
WHERE i.po_no IN (
    'PO-0000003', 'PO-0000006', 'PO-0000009', 'PO-0000013', 'PO-0000016'
)
ORDER BY i.po_no, i.line_no
""",
]
order_matters = true
names_matter = true
excel_tip = "SUMIF the receipts by order and line first, then look that total up. Do not add the order quantity inside the receipt rows."

[[exercise]]
id = "join-etch-tool-components"
title = "Components of one etch tool"
prompt_md = """
**Situation**

A production planner needs the first-level parts list for a specific Etch tool.

**Business question**

Which direct components does tool M-000011 contain, and in what quantities?

**SQL task**

List the direct components of tool M-000011, Etch system, 300mm, 2-chamber, conductor.
The parent is parent_material_no on bom_item.
Return component_material_no, description, and qty_per.
The description comes from material.
Order by component_material_no.
Another Etch tool also has 2 chambers, so keep this material number.

**Reflect after Check (not graded)**

This list covers direct components only.
Open the lower-level BOMs before treating it as a complete purchased-parts requirement.
"""
hints = [
  "The bill of materials lists the direct components, and material holds their descriptions.",
  "Filter bom_item to parent_material_no = 'M-000011' and join material on component_material_no.",
  "SELECT b.component_material_no, m.description, b.qty_per FROM bom_item AS b JOIN material AS m ON ___ WHERE b.parent_material_no = ___ ORDER BY b.component_material_no",
]
reference_sql = [
  """
SELECT b.component_material_no, m.description, b.qty_per
FROM bom_item AS b
JOIN material AS m ON m.material_no = b.component_material_no
WHERE b.parent_material_no = 'M-000011'
ORDER BY b.component_material_no
""",
]
order_matters = true
names_matter = true
excel_tip = "Filter the bill of materials to one parent, then VLOOKUP each component description."

[[exercise]]
id = "join-single-source-long-lead"
title = "Single-source materials"
prompt_md = """
**Situation**

Sourcing is preparing an initial review of materials with only one quoted supplier.

**Business question**

Which materials have exactly one supplier record?

**SQL task**

Find materials that have exactly one row on material_supplier.
Return material_no, description, and supplier_no.
Order by material_no.
Filtering to the description RF generator is not the definition.
Other materials have exactly one supplier too.

**Reflect after Check (not graded)**

Treat the list as single-source exposure in the available records.
Review qualification, lead time, inventory, and demand before assigning a risk priority.
"""
hints = [
  "A single-source material has exactly one supplier row.",
  "Join material to material_supplier, group by material, and keep HAVING COUNT(*) = 1.",
  "SELECT m.material_no, m.description, MIN(___) AS supplier_no FROM material AS m JOIN material_supplier AS s ON ___ GROUP BY m.material_no, m.description HAVING COUNT(*) = ___ ORDER BY m.material_no",
]
reference_sql = [
  """
SELECT m.material_no, m.description, min(s.supplier_no) AS supplier_no
FROM material AS m
JOIN material_supplier AS s ON s.material_no = m.material_no
GROUP BY m.material_no, m.description
HAVING count(*) = 1
ORDER BY m.material_no
""",
]
order_matters = true
names_matter = true
excel_tip = "Pivot the source list by material, keep counts of 1, and bring back the one supplier number."

[[exercise]]
id = "join-corvane-late-lines"
title = "Late open lines from Corvane"
prompt_md = """
**Situation**

Corvane's delivery promises have slipped, and purchasing needs a precise list for a recovery call.

**Business question**

Which outstanding Corvane lines are confirmed at least 56 days after their requested dates?

**SQL task**

List open purchase order lines for Corvane RF Systems, supplier V-10017.
The order was placed on or before 1 November 2026.
Received quantity is below order_qty.
confirmed_delivery_date is at least 56 days after requested_delivery_date.
Return po_no, line_no, description, requested_delivery_date, and confirmed_delivery_date.
Order by po_no, then line_no.
The RF generator lines in this list are the ones behind the at-risk Etch orders in lesson 9.
Other late lines in this list are not that shortage.

**Reflect after Check (not graded)**

Separate the RF generator lines from other late items.
Trace demand and available supply before saying which customer orders are affected.
"""
hints = [
  "An open Corvane line is late when the confirmed date is at least 56 days after the requested date.",
  "Sum receipts before comparing them with order_qty, and compare the confirmed date to requested_delivery_date + INTERVAL 56 DAY.",
  "SELECT i.po_no, i.line_no, m.description, i.requested_delivery_date, i.confirmed_delivery_date FROM purchase_order_item AS i JOIN purchase_order AS h ON ___ JOIN material AS m ON ___ LEFT JOIN (SELECT po_no, line_no, SUM(___) AS received_qty FROM goods_receipt GROUP BY po_no, line_no) AS r ON ___ WHERE h.supplier_no = ___ AND h.order_date <= ___ AND COALESCE(r.received_qty, 0) < ___ AND i.confirmed_delivery_date >= ___ ORDER BY i.po_no, i.line_no",
]
reference_sql = [
  """
SELECT i.po_no, i.line_no, m.description,
       i.requested_delivery_date, i.confirmed_delivery_date
FROM purchase_order_item AS i
JOIN purchase_order AS h ON h.po_no = i.po_no
JOIN material AS m ON m.material_no = i.material_no
LEFT JOIN (
    SELECT po_no, line_no, sum(qty) AS received_qty
    FROM goods_receipt
    GROUP BY po_no, line_no
) AS r ON r.po_no = i.po_no AND r.line_no = i.line_no
WHERE h.supplier_no = 'V-10017'
  AND h.order_date <= DATE '2026-11-01'
  AND coalesce(r.received_qty, 0) < i.order_qty
  AND i.confirmed_delivery_date >= i.requested_delivery_date + INTERVAL 56 DAY
ORDER BY i.po_no, i.line_no
""",
]
order_matters = true
names_matter = true
excel_tip = "Filter to supplier V-10017, and keep a confirmed date on or after the requested date plus 56 days."
