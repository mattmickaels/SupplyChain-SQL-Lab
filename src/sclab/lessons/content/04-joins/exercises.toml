WHERE h.customer_no = 'C-2003'
  AND i.status = 'Open'
ORDER BY i.requested_date, i.so_no, i.line_no
""",
]
order_matters = true
names_matter = true
excel_tip = "Filter the order header to customer C-2003, then list the open lines sorted by requested date."

[[exercise]]
id = "join-open-rf-po-lines"
title = "Open RF generator purchase lines"
prompt_md = """
List open purchase order lines for the material whose description is RF generator.
The order was placed on or before 1 November 2026.
Received quantity is below order_qty.
confirmed_delivery_date is on or after 1 November 2026.
Return po_no, line_no, supplier_name, and confirmed_delivery_date.
Order by confirmed_delivery_date, then po_no, then line_no.
"""
hints = [
  "An open RF generator line is not fully received, and its confirmed date is still ahead.",
  "Sum goods_receipt.qty by po_no and line_no before comparing it with order_qty, and join supplier for the name.",
  "SELECT i.po_no, i.line_no, s.name AS supplier_name, i.confirmed_delivery_date FROM purchase_order_item AS i JOIN purchase_order AS h ON h.po_no = i.po_no JOIN supplier AS s ON s.supplier_no = h.supplier_no JOIN material AS m ON m.material_no = i.material_no LEFT JOIN (SELECT po_no, line_no, SUM(qty) AS received_qty FROM goods_receipt GROUP BY po_no, line_no) AS r ON r.po_no = i.po_no AND r.line_no = i.line_no WHERE m.description = 'RF generator' AND h.order_date <= DATE '2026-11-01' AND COALESCE(r.received_qty, 0) < i.order_qty AND i.confirmed_delivery_date >= DATE '2026-11-01' ORDER BY i.confirmed_delivery_date, i.po_no, i.line_no",
]
reference_sql = [
  """
SELECT i.po_no, i.line_no, s.name AS supplier_name, i.confirmed_delivery_date
FROM purchase_order_item AS i
JOIN purchase_order AS h ON h.po_no = i.po_no
JOIN supplier AS s ON s.supplier_no = h.supplier_no
JOIN material AS m ON m.material_no = i.material_no
LEFT JOIN (
    SELECT po_no, line_no, sum(qty) AS received_qty
    FROM goods_receipt
    GROUP BY po_no, line_no
) AS r ON r.po_no = i.po_no AND r.line_no = i.line_no
WHERE m.description = 'RF generator'
  AND h.order_date <= DATE '2026-11-01'
  AND coalesce(r.received_qty, 0) < i.order_qty
  AND i.confirmed_delivery_date >= DATE '2026-11-01'
ORDER BY i.confirmed_delivery_date, i.po_no, i.line_no
""",
]
order_matters = true
names_matter = true
excel_tip = "Filter to RF generator, then look up the supplier name and keep lines that are not fully received."

[[exercise]]
id = "join-october-received-qty"
title = "Received quantity for October orders"
prompt_md = """
For purchase order lines placed in October 2026, show how much has been received.
Return po_no, line_no, order_qty, and received_qty.
received_qty is the sum of goods_receipt.qty for that line, or 0 when nothing has been received.
Order by po_no, then line_no.
Add the receipts up before you join them, so order_qty is not repeated once per receipt.
"""
hints = [
  "Add up receipts by purchase line first, so the order quantity is not repeated.",
  "SUM goods_receipt.qty in a grouped query, then LEFT JOIN it to the October lines.",
  "SELECT i.po_no, i.line_no, i.order_qty, COALESCE(r.received_qty, 0) AS received_qty FROM purchase_order_item AS i JOIN purchase_order AS h ON h.po_no = i.po_no LEFT JOIN (SELECT po_no, line_no, SUM(qty) AS received_qty FROM goods_receipt GROUP BY po_no, line_no) AS r ON r.po_no = i.po_no AND r.line_no = i.line_no WHERE h.order_date >= DATE '2026-10-01' AND h.order_date <= DATE '2026-10-31' ORDER BY i.po_no, i.line_no",
]
reference_sql = [
  """
SELECT i.po_no, i.line_no, i.order_qty, coalesce(r.received_qty, 0) AS received_qty
FROM purchase_order_item AS i
JOIN purchase_order AS h ON h.po_no = i.po_no
LEFT JOIN (
    SELECT po_no, line_no, sum(qty) AS received_qty
    FROM goods_receipt
    GROUP BY po_no, line_no
) AS r ON r.po_no = i.po_no AND r.line_no = i.line_no
WHERE h.order_date >= DATE '2026-10-01'
  AND h.order_date <= DATE '2026-10-31'
ORDER BY i.po_no, i.line_no
""",
]
order_matters = true
names_matter = true
excel_tip = "SUMIF the receipts by order and line first, then look that total up. Do not add the order quantity inside the receipt rows."

[[exercise]]
id = "join-etch-tool-components"
title = "Components of one etch tool"
prompt_md = """
List the direct components of tool M-000011, Etch system, 300mm, 2-chamber.
The parent is parent_material_no on bom_item.
Return component_material_no, description, and qty_per.
The description comes from material.
Order by component_material_no.
Another tool uses the same description, so keep this material number.
"""
hints = [
  "The bill of materials lists the direct components, and material holds their descriptions.",
  "Filter bom_item to parent_material_no = 'M-000011' and join material on component_material_no.",
  "SELECT b.component_material_no, m.description, b.qty_per FROM bom_item AS b JOIN material AS m ON m.material_no = b.component_material_no WHERE b.parent_material_no = 'M-000011' ORDER BY b.component_material_no",
]
reference_sql = [
  """
SELECT b.component_material_no, m.description, b.qty_per
FROM bom_item AS b
JOIN material AS m ON m.material_no = b.component_material_no
WHERE b.parent_material_no = 'M-000011'
ORDER BY b.component_material_no
""",
]
order_matters = true
names_matter = true
excel_tip = "Filter the bill of materials to one parent, then VLOOKUP each component description."

[[exercise]]
id = "join-single-source-long-lead"
title = "Single-source long-lead materials"
prompt_md = """
Find long-lead materials that have exactly one row on material_supplier.
Return material_no, description, and supplier_no.
Order by material_no.
"""
hints = [
  "A single-source material has exactly one supplier row.",
  "Join material to material_supplier, keep is_long_lead = true, and HAVING COUNT(*) = 1.",
  "SELECT m.material_no, m.description, MIN(s.supplier_no) AS supplier_no FROM material AS m JOIN material_supplier AS s ON s.material_no = m.material_no WHERE m.is_long_lead = true GROUP BY m.material_no, m.description HAVING COUNT(*) = 1 ORDER BY m.material_no",
]
reference_sql = [
  """
SELECT m.material_no, m.description, min(s.supplier_no) AS supplier_no
FROM material AS m
JOIN material_supplier AS s ON s.material_no = m.material_no
WHERE m.is_long_lead = true
GROUP BY m.material_no, m.description
HAVING count(*) = 1
ORDER BY m.material_no
""",
]
order_matters = true
names_matter = true
excel_tip = "Pivot the source list by material, keep counts of 1, and bring back the one supplier number."

[[exercise]]
id = "join-corvane-late-lines"
title = "Late open lines from Corvane"
prompt_md = """
List open purchase order lines for Corvane RF Systems, supplier V-10017.
The order was placed on or before 1 November 2026.
Received quantity is below order_qty.
confirmed_delivery_date is at least 56 days after requested_delivery_date.
Return po_no, line_no, description, requested_delivery_date, and confirmed_delivery_date.
Order by po_no, then line_no.
These are the late component lines behind the six Etch orders you will study in lesson 9.
"""
hints = [
  "An open Corvane line is late when the confirmed date is at least 56 days after the requested date.",
  "Sum receipts before comparing them with order_qty, and subtract the two dates.",
  "SELECT i.po_no, i.line_no, m.description, i.requested_delivery_date, i.confirmed_delivery_date FROM purchase_order_item AS i JOIN purchase_order AS h ON h.po_no = i.po_no JOIN material AS m ON m.material_no = i.material_no LEFT JOIN (SELECT po_no, line_no, SUM(qty) AS received_qty FROM goods_receipt GROUP BY po_no, line_no) AS r ON r.po_no = i.po_no AND r.line_no = i.line_no WHERE h.supplier_no = 'V-10017' AND h.order_date <= DATE '2026-11-01' AND COALESCE(r.received_qty, 0) < i.order_qty AND i.confirmed_delivery_date - i.requested_delivery_date >= 56 ORDER BY i.po_no, i.line_no",
]
reference_sql = [
  """
SELECT i.po_no, i.line_no, m.description,
       i.requested_delivery_date, i.confirmed_delivery_date
FROM purchase_order_item AS i
JOIN purchase_order AS h ON h.po_no = i.po_no
JOIN material AS m ON m.material_no = i.material_no
LEFT JOIN (
    SELECT po_no, line_no, sum(qty) AS received_qty
    FROM goods_receipt
    GROUP BY po_no, line_no
) AS r ON r.po_no = i.po_no AND r.line_no = i.line_no
WHERE h.supplier_no = 'V-10017'
  AND h.order_date <= DATE '2026-11-01'
  AND coalesce(r.received_qty, 0) < i.order_qty
  AND i.confirmed_delivery_date - i.requested_delivery_date >= 56
ORDER BY i.po_no, i.line_no
""",
]
order_matters = true
names_matter = true
excel_tip = "Filter to supplier V-10017, subtract the two date columns, and keep gaps of 56 days or more."
