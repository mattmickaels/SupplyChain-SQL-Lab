[[fact]]
id = "customers-without-july-tool-order"
sql = """
SELECT COUNT(*)
FROM customer AS c
LEFT JOIN (
    SELECT h.customer_no, MAX(h.order_date) AS last_tool_order_date
    FROM sales_order AS h
    JOIN sales_order_item AS i ON i.so_no = h.so_no
    JOIN material AS m ON m.material_no = i.material_no
    WHERE m.material_type = 'TOOL'
    GROUP BY h.customer_no
) AS latest ON latest.customer_no = c.customer_no
WHERE latest.last_tool_order_date IS NULL
   OR latest.last_tool_order_date < DATE '2026-06-24'
"""
expected = 0

