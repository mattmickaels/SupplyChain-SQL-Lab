[[exercise]]
id = "dates-october-late-receipts"
title = "October receipts that arrived late"
prompt_md = """
**Situation**

Receiving and purchasing are reviewing delivery exceptions from October.

**Business question**

Which receipt events arrived after their confirmed dates, and by how many days?

**SQL task**

List goods receipts in October 2026 that arrived after the confirmed date.
October is receipt_date from 1 October 2026 through 31 October 2026.
A receipt on the confirmed date is not late.
Return po_no, line_no, receipt_date, confirmed_delivery_date, and days_late.
days_late is the number of days from confirmed_delivery_date to receipt_date.
Order by days_late descending, then po_no, then line_no.

**Reflect after Check (not graded)**

Use the largest delays to choose examples for investigation.
A late receipt event is not automatically a late whole order or proof of customer impact.
"""
hints = [
  "Late means the receipt date is after the confirmed date.",
  "Join goods_receipt to purchase_order_item and use datediff('day', confirmed_delivery_date, receipt_date).",
  "SELECT g.po_no, g.line_no, g.receipt_date, i.confirmed_delivery_date, datediff('day', ___, ___) AS days_late FROM goods_receipt AS g JOIN purchase_order_item AS i ON ___ WHERE g.receipt_date >= ___ AND g.receipt_date <= ___ AND g.receipt_date > ___ ORDER BY days_late DESC, g.po_no, g.line_no",
]
reference_sql = [
  """
SELECT g.po_no, g.line_no, g.receipt_date, i.confirmed_delivery_date,
       datediff('day', i.confirmed_delivery_date, g.receipt_date) AS days_late
FROM goods_receipt AS g
JOIN purchase_order_item AS i ON i.po_no = g.po_no AND i.line_no = g.line_no
WHERE g.receipt_date >= DATE '2026-10-01'
  AND g.receipt_date <= DATE '2026-10-31'
  AND g.receipt_date > i.confirmed_delivery_date
ORDER BY days_late DESC, g.po_no, g.line_no
""",
]
order_matters = true
names_matter = true
excel_tip = "Subtract the confirmed date from the receipt date, then keep the rows where that gap is positive."
databricks_note = "Write `datediff(DAY, i.confirmed_delivery_date, g.receipt_date)` or `datediff(g.receipt_date, i.confirmed_delivery_date)` in place of `datediff('day', i.confirmed_delivery_date, g.receipt_date)`."

[[exercise]]
id = "dates-late-rate-by-year"
title = "Late receipt rate by year"
prompt_md = """
**Situation**

The purchasing manager wants a historical view of receipt lateness.

**Business question**

How does the late receipt rate vary by year?

**SQL task**

For each year from 2022 through 2026, show the late receipt rate.
Use receipt_date from 1 January 2022 up to but not including 1 January 2027.
A receipt is late when receipt_date is after confirmed_delivery_date.
Return receipt_year, receipt_count, late_count, and late_pct.
late_pct is 100 times late_count divided by receipt_count, rounded to 1 decimal.
Order by receipt_year.

**Reflect after Check (not graded)**

Compare rates alongside receipt counts.
The 2026 data ends in October, so avoid describing it as a full-year result or treating a rate change alone as proof of a cause.
"""
hints = [
  "Group the receipts by year, then divide the late ones by the total.",
  "Multiply by 100.0 before you round to 1 decimal, and keep years 2022 through 2026.",
  "SELECT EXTRACT(YEAR FROM g.receipt_date) AS ___, COUNT(*) AS receipt_count, SUM(CASE WHEN ___ THEN 1 ELSE 0 END) AS late_count, ROUND(___ / COUNT(*), 1) AS late_pct FROM goods_receipt AS g JOIN purchase_order_item AS i ON ___ WHERE g.receipt_date >= ___ AND g.receipt_date < ___ GROUP BY ___ ORDER BY receipt_year",
]
reference_sql = [
  """
SELECT EXTRACT(YEAR FROM g.receipt_date) AS receipt_year,
       COUNT(*) AS receipt_count,
       SUM(CASE WHEN g.receipt_date > i.confirmed_delivery_date THEN 1 ELSE 0 END) AS late_count,
       ROUND(
           100.0 * SUM(CASE WHEN g.receipt_date > i.confirmed_delivery_date THEN 1 ELSE 0 END)
           / COUNT(*),
           1
       ) AS late_pct
FROM goods_receipt AS g
JOIN purchase_order_item AS i ON i.po_no = g.po_no AND i.line_no = g.line_no
WHERE g.receipt_date >= DATE '2022-01-01'
  AND g.receipt_date < DATE '2027-01-01'
GROUP BY EXTRACT(YEAR FROM g.receipt_date)
ORDER BY receipt_year
""",
]
order_matters = true
names_matter = true
excel_tip = "This is a pivot of receipts by year, with a count of late rows divided by the count of all rows."

[[exercise]]
id = "dates-actual-vs-quoted-lead-time"
title = "Actual lead time versus the quote"
prompt_md = """
**Situation**

Planning suspects some supplier lead-time assumptions may differ from recent delivery experience.

**Business question**

How do average actual first-receipt lead times compare with quoted lead times?

**SQL task**

Compare actual lead time with the supplier's quoted lead time.
The last 12 months are receipt_date from 1 November 2025 up to but not including 1 November 2026.
Keep a supplier only when that supplier has at least 20 goods receipts in that window.
Actual lead time is the days from purchase_order.order_date to the first receipt_date on the line.
Include a line only when that first receipt falls in the same 12 month window.
Quoted lead time is material_supplier.quoted_lead_time_days for that line's material and the purchase order's supplier.
Average both numbers per supplier and round each average to 1 decimal.
The quoted average skips blank quotes and still includes a quote of 0.
Return supplier_no, avg_actual_lead_time_days, avg_quoted_lead_time_days, and receipt_count.
Order by supplier_no.

**Reflect after Check (not graded)**

Look for suppliers whose averages differ enough to investigate.
Check the material mix, missing quotes, and receipt population before recommending a new planning lead time.
"""
hints = [
  "Take the earliest receipt on each line, then average those day counts by supplier.",
  "Count goods receipts in the last 12 months, keep suppliers with at least 20, and round both averages to 1 decimal.",
  "SELECT line.supplier_no, ROUND(AVG(line.actual_days), 1) AS ___, ROUND(AVG(q.quoted_lead_time_days), 1) AS ___, r.receipt_count FROM (SELECT ... MIN(g.receipt_date) ... datediff('day', h.order_date, MIN(g.receipt_date)) AS actual_days ...) AS line JOIN (SELECT h.supplier_no, COUNT(*) AS receipt_count ... HAVING COUNT(*) >= ___) AS r ON ___ LEFT JOIN material_supplier AS q ON ___ WHERE line.first_receipt_date >= ___ AND line.first_receipt_date < ___ GROUP BY line.supplier_no, r.receipt_count ORDER BY line.supplier_no",
]
reference_sql = [
  """
SELECT line.supplier_no,
       ROUND(AVG(line.actual_days), 1) AS avg_actual_lead_time_days,
       ROUND(AVG(q.quoted_lead_time_days), 1) AS avg_quoted_lead_time_days,
       r.receipt_count
FROM (
    SELECT i.po_no,
           i.line_no,
           i.material_no,
           h.supplier_no,
           MIN(g.receipt_date) AS first_receipt_date,
           datediff('day', h.order_date, MIN(g.receipt_date)) AS actual_days
    FROM purchase_order_item AS i
    JOIN purchase_order AS h ON h.po_no = i.po_no
    JOIN goods_receipt AS g ON g.po_no = i.po_no AND g.line_no = i.line_no
    GROUP BY i.po_no, i.line_no, i.material_no, h.supplier_no, h.order_date
) AS line
JOIN (
    SELECT h.supplier_no, COUNT(*) AS receipt_count
    FROM goods_receipt AS g
    JOIN purchase_order AS h ON h.po_no = g.po_no
    WHERE g.receipt_date >= DATE '2025-11-01'
      AND g.receipt_date < DATE '2026-11-01'
    GROUP BY h.supplier_no
    HAVING COUNT(*) >= 20
) AS r ON r.supplier_no = line.supplier_no
LEFT JOIN material_supplier AS q
  ON q.material_no = line.material_no
 AND q.supplier_no = line.supplier_no
WHERE line.first_receipt_date >= DATE '2025-11-01'
  AND line.first_receipt_date < DATE '2026-11-01'
GROUP BY line.supplier_no, r.receipt_count
ORDER BY line.supplier_no
""",
]
order_matters = true
names_matter = true
excel_tip = "Find the first receipt date per order line with MINIFS, subtract the order date, then average that gap next to the quoted lead time."
databricks_note = "Write `datediff(DAY, h.order_date, MIN(g.receipt_date))` or `datediff(MIN(g.receipt_date), h.order_date)` in place of `datediff('day', h.order_date, MIN(g.receipt_date))`."

[[exercise]]
id = "dates-lines-booked-by-month"
title = "Sales lines booked by month in 2025"
prompt_md = """
**Situation**

Sales operations is reviewing how order-entry workload varied through 2025.

**Business question**

How many sales lines were booked in each month?

**SQL task**

Count sales order lines booked in each month of 2025.
A line is booked on sales_order.order_date, not on the requested date.
Keep order_date from 1 January 2025 up to but not including 1 January 2026.
Count every line.
Include cancelled lines.
A line is booked on the order date even when status is later Cancelled.
Return booked_month and line_count.
booked_month is date_trunc('month', order_date).
Order by booked_month.

**Reflect after Check (not graded)**

Describe the pattern in line counts, not units or revenue.
Cancelled lines remain in this booking history; check cancellations separately when assessing current demand.
"""
hints = [
  "The booking month comes from the sales order header.",
  "Join the line to sales_order, keep 2025, and group by date_trunc('month', order_date).",
  "SELECT date_trunc('month', h.order_date) AS ___, COUNT(*) AS line_count FROM sales_order_item AS i JOIN sales_order AS h ON ___ WHERE h.order_date >= ___ AND h.order_date < ___ GROUP BY ___ ORDER BY booked_month",
]
reference_sql = [
  """
SELECT date_trunc('month', h.order_date) AS booked_month,
       COUNT(*) AS line_count
FROM sales_order_item AS i
JOIN sales_order AS h ON h.so_no = i.so_no
WHERE h.order_date >= DATE '2025-01-01'
  AND h.order_date < DATE '2026-01-01'
GROUP BY date_trunc('month', h.order_date)
ORDER BY booked_month
""",
]
order_matters = true
names_matter = true
excel_tip = "Group the order date with EOMONTH or the first of the month, then count the lines."

[[exercise]]
id = "dates-open-po-lines-by-week"
title = "Open purchase lines due in the next 8 weeks"
prompt_md = """
**Situation**

The receiving team wants a view of confirmed incoming purchase-line workload for the next eight weeks.

**Business question**

How many outstanding purchase lines fall into each delivery week?

**SQL task**

Count open purchase order lines by the week of the confirmed delivery date.
A line is open when received quantity is below order_qty.
A line with no goods receipt has received quantity 0.
Due in the next 8 weeks means confirmed_delivery_date is on or after 1 November 2026 and before 27 December 2026.
27 December 2026 is 1 November 2026 plus 56 days.
A line confirmed on 27 December 2026 is not due in the next 8 weeks.
week_start is date_trunc('week', confirmed_delivery_date), the Monday of that week.
1 November 2026 falls in the week starting 26 October 2026.
The result has 9 week rows.
The first week starts on 26 October 2026, and the last week starts on 21 December 2026.
Past-due open lines are a separate bucket and are excluded here.
A past-due open line is still short of order_qty and has confirmed_delivery_date before 1 November 2026.
That bucket has 1726 lines.
Return week_start and open_line_count.
Order by week_start.

**Reflect after Check (not graded)**

Identify busy weeks, then assess quantities and handling requirements separately.
Review the excluded overdue lines in a separate queue rather than assuming they disappeared.
"""
hints = [
  "Add the receipts up first, then keep lines that are still short and due in the next 56 days.",
  "Group by date_trunc('week', confirmed_delivery_date) and count the open lines.",
  "SELECT date_trunc('week', i.confirmed_delivery_date) AS ___, COUNT(*) AS open_line_count FROM purchase_order_item AS i LEFT JOIN (SELECT po_no, line_no, SUM(___) AS received_qty FROM goods_receipt GROUP BY po_no, line_no) AS r ON ___ WHERE i.confirmed_delivery_date >= ___ AND i.confirmed_delivery_date < ___ AND COALESCE(r.received_qty, 0) < ___ GROUP BY ___ ORDER BY week_start",
]
reference_sql = [
  """
SELECT date_trunc('week', i.confirmed_delivery_date) AS week_start,
       COUNT(*) AS open_line_count
FROM purchase_order_item AS i
LEFT JOIN (
    SELECT po_no, line_no, SUM(qty) AS received_qty
    FROM goods_receipt
    GROUP BY po_no, line_no
) AS r ON r.po_no = i.po_no AND r.line_no = i.line_no
WHERE i.confirmed_delivery_date >= DATE '2026-11-01'
  AND i.confirmed_delivery_date < DATE '2026-11-01' + INTERVAL 56 DAY
  AND COALESCE(r.received_qty, 0) < i.order_qty
GROUP BY date_trunc('week', i.confirmed_delivery_date)
ORDER BY week_start
""",
]
order_matters = true
names_matter = true
excel_tip = "Sum the receipts with SUMIF, keep lines still short of the order quantity, and group the confirmed date by week."

[[exercise]]
id = "dates-quiet-tool-customers"
title = "Customers with no recent tool order"
prompt_md = """
**Situation**

Account managers want to check in with customers that have not placed a recent tool order.

**Business question**

Which customers last ordered a tool more than 90 days before the snapshot?

**SQL task**

Find customers whose most recent tool order is more than 90 days before 1 November 2026.
A tool order is a sales order line whose material has material_type = 'TOOL'.
Use one row per customer, not per product family.
365 days, 270 days, and 180 days before 1 November 2026 each match no customer.
Every customer ordered a tool on or after 24 June 2026, so the threshold that still leaves a customer out is 90 days.
More than 90 days means last_tool_order_date + INTERVAL 90 DAY is still before DATE '2026-11-01'.
A customer whose last tool order was exactly 90 days before 1 November 2026 is not more than 90 days, so that customer stays out.
Return customer_no, name, and last_tool_order_date.
name is customer.name.
last_tool_order_date is the latest sales_order.order_date among that customer's tool lines.
Order by last_tool_order_date, then customer_no.

**Reflect after Check (not graded)**

Use the result as an outreach list.
Check the customer's buying cycle and account history before interpreting a quiet period as lost business.
"""
hints = [
  "Take the latest tool order once per customer.",
  "Keep customers where that date plus 90 days is still before 1 November 2026.",
  "SELECT c.customer_no, c.name, MAX(h.order_date) AS last_tool_order_date FROM customer AS c JOIN sales_order AS h ON ___ JOIN sales_order_item AS i ON ___ JOIN material AS m ON ___ WHERE m.material_type = ___ GROUP BY c.customer_no, c.name HAVING MAX(h.order_date) + INTERVAL ___ DAY < ___ ORDER BY last_tool_order_date, c.customer_no",
]
reference_sql = [
  """
SELECT c.customer_no,
       c.name,
       MAX(h.order_date) AS last_tool_order_date
FROM customer AS c
JOIN sales_order AS h ON h.customer_no = c.customer_no
JOIN sales_order_item AS i ON i.so_no = h.so_no
JOIN material AS m ON m.material_no = i.material_no
WHERE m.material_type = 'TOOL'
GROUP BY c.customer_no, c.name
HAVING MAX(h.order_date) + INTERVAL 90 DAY < DATE '2026-11-01'
ORDER BY last_tool_order_date, c.customer_no
""",
]
order_matters = true
names_matter = true
excel_tip = "Take the latest tool order date per customer with MAXIFS, then keep dates more than 90 days before 1 November 2026."

[[exercise]]
id = "dates-corvane-on-time-by-quarter"
title = "Corvane on-time rate by quarter"
prompt_md = """
**Situation**

Purchasing needs delivery-history evidence for a performance discussion with Corvane.

**Business question**

How has Corvane's on-time receipt rate changed by quarter?

**SQL task**

Show Corvane RF Systems on-time rate by quarter for 2025 and 2026.
Corvane is supplier V-10017.
Use receipt_date from 1 January 2025 up to but not including 1 January 2027.
A receipt is on time when receipt_date is on or before confirmed_delivery_date.
Return receipt_year, receipt_quarter, receipt_count, and on_time_pct.
on_time_pct is 100 times the on-time receipts divided by receipt_count, rounded to 1 decimal.
Order by receipt_year, then receipt_quarter.
The fourth quarter of 2026 only contains receipts through the end of October 2026.

**Reflect after Check (not graded)**

Describe the pattern alongside the receipt counts.
The last quarter contains October only; investigate the underlying receipts before explaining why performance changed.
"""
hints = [
  "On time includes a receipt that lands on the confirmed date.",
  "Filter supplier V-10017, group by year and quarter, and round 100.0 times the on-time share to 1 decimal.",
  "SELECT EXTRACT(YEAR FROM g.receipt_date) AS ___, EXTRACT(QUARTER FROM g.receipt_date) AS ___, COUNT(*) AS receipt_count, ROUND(100.0 * SUM(CASE WHEN ___ THEN 1 ELSE 0 END) / COUNT(*), 1) AS on_time_pct FROM goods_receipt AS g JOIN purchase_order_item AS i ON ___ JOIN purchase_order AS h ON ___ WHERE h.supplier_no = ___ AND g.receipt_date >= ___ AND g.receipt_date < ___ GROUP BY ___ ORDER BY receipt_year, receipt_quarter",
]
reference_sql = [
  """
SELECT EXTRACT(YEAR FROM g.receipt_date) AS receipt_year,
       EXTRACT(QUARTER FROM g.receipt_date) AS receipt_quarter,
       COUNT(*) AS receipt_count,
       ROUND(
           100.0 * SUM(CASE WHEN g.receipt_date <= i.confirmed_delivery_date THEN 1 ELSE 0 END)
           / COUNT(*),
           1
       ) AS on_time_pct
FROM goods_receipt AS g
JOIN purchase_order_item AS i ON i.po_no = g.po_no AND i.line_no = g.line_no
JOIN purchase_order AS h ON h.po_no = g.po_no
WHERE h.supplier_no = 'V-10017'
  AND g.receipt_date >= DATE '2025-01-01'
  AND g.receipt_date < DATE '2027-01-01'
GROUP BY EXTRACT(YEAR FROM g.receipt_date), EXTRACT(QUARTER FROM g.receipt_date)
ORDER BY receipt_year, receipt_quarter
""",
]
order_matters = true
names_matter = true
excel_tip = "Filter to supplier V-10017, pivot receipts by year and quarter, and divide the on-time count by the receipt count."
