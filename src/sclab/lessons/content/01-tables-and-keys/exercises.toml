[[exercise]]
id = "plant-columns"
title = "Every plant column"
prompt_md = """
Show every column of plant.
The columns are plant_code, name, city, and country.
"""
hints = [
  "Every column means the whole plant row, not a filtered subset.",
  "Use SELECT and FROM, with no WHERE.",
  "SELECT ___, ___, ___, ___ FROM plant",
]
reference_sql = [
  """
  SELECT plant_code, name, city, country
  FROM plant
  """,
  "SELECT * FROM plant",
]
order_matters = false
names_matter = true
excel_tip = "This is like opening the plant sheet and keeping every column."

[[exercise]]
id = "material-list"
title = "Material numbers and types"
prompt_md = """
List material_no, description, and material_type for every material.
"""
hints = [
  "You want three facts about every material, and the other columns stay out.",
  "SELECT those three names FROM material.",
  "SELECT ___, ___, ___ FROM material",
]
reference_sql = [
  """
  SELECT material_no, description, material_type
  FROM material
  """,
  """
  SELECT description, material_type, material_no
  FROM material
  """,
]
order_matters = false
names_matter = true
excel_tip = "This is like hiding every column except the three you were asked for."

[[exercise]]
id = "purchase-line-count"
title = "How many purchase lines"
prompt_md = """
How many rows does purchase_order_item have?
Return one column with that number.
"""
hints = [
  "The question asks how many rows exist, which is one number.",
  "Use COUNT(*) on purchase_order_item.",
  "SELECT COUNT(*) AS ___ FROM ___",
]
reference_sql = [
  """
  SELECT count(*) AS row_count
  FROM purchase_order_item
  """,
  """
  SELECT count(*)
  FROM purchase_order_item
  """,
]
order_matters = false
names_matter = false
excel_tip = "This is like seeing the row count in the status bar of a sheet."

[[exercise]]
id = "supplier-key"
title = "Prove supplier numbers are unique"
prompt_md = """
Prove supplier_no is unique on supplier.
Return two columns, row_count and supplier_count.
row_count is count(*).
supplier_count is count(DISTINCT supplier_no).
When the two numbers match, every supplier number appears on exactly one row.
"""
hints = [
  "A unique key means the row count equals the count of different supplier numbers.",
  "Use COUNT(*) and COUNT(DISTINCT supplier_no) in the same SELECT.",
  "SELECT COUNT(*) AS ___, COUNT(DISTINCT ___) AS ___ FROM supplier",
]
reference_sql = [
  """
  SELECT count(*) AS row_count, count(DISTINCT supplier_no) AS supplier_count
  FROM supplier
  """,
  """
  SELECT count(DISTINCT supplier_no) AS supplier_count, count(*) AS row_count
  FROM supplier
  """,
]
order_matters = false
names_matter = true
excel_tip = "This is like comparing a row count with the count of unique values in one column."

[[exercise]]
id = "corvane-po-lines"
title = "Lines on one Corvane order"
prompt_md = """
Purchase order PO-0006180 was sent to Corvane RF Systems, supplier V-10017.
Show po_no, line_no, material_no, and order_qty for every line on that order.
po_no alone is not the key, because one order has several lines.
po_no plus line_no is the key, because that pair identifies exactly one line.
"""
hints = [
  "Several lines can share one purchase order number, so filter to the named order.",
  "Use WHERE po_no = 'PO-0006180' on purchase_order_item.",
  "SELECT po_no, line_no, material_no, order_qty FROM ___ WHERE po_no = ___",
]
reference_sql = [
  """
  SELECT po_no, line_no, material_no, order_qty
  FROM purchase_order_item
  WHERE po_no = 'PO-0006180'
  """,
  """
  SELECT line_no, po_no, order_qty, material_no
  FROM purchase_order_item
  WHERE po_no = 'PO-0006180'
  ORDER BY line_no
  """,
]
order_matters = false
names_matter = true
excel_tip = "This is like filtering the PO sheet to one order and seeing several line rows."
